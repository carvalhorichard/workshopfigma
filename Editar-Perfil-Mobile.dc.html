<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editar perfil — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder, textarea::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; box-sizing: border-box; background: var(--canvas); display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--elevated); flex-shrink: 0;">
    <a href="Perfil-Mobile.dc.html" aria-label="Descartar e voltar" style="width: 44px; height: 44px; margin-left: -12px; border-radius: 999px; color: var(--text-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-1); min-width: 0;">Editar perfil</h1>
    <div style="flex-grow: 1;"></div>
    <a href="Perfil-Mobile.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 12px; background: {{ accent }}; font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--on-brand); flex-shrink: 0;">Salvar</a>
  </header>

  <div style="position: relative; width: 100%; height: 132px; background: var(--elevated); flex-shrink: 0;">
    <img src="./assets/ca781dd1e6445e3b373de9a2db61e75c.jpg" alt="Capa atual do perfil" style="width: 100%; height: 100%; object-fit: cover;">
    <div style="position: absolute; inset: 0; background: rgba(18, 17, 20, 0.45);"></div>
    <button type="button" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(241, 241, 242, 0.32); background: rgba(25, 24, 27, 0.6); font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--on-brand); cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m6 16 4-4 3 3 2-2 3 3"></path></svg>
      Trocar capa
    </button>
  </div>

  <div style="position: relative; z-index: 1; padding: 0 16px; margin-top: -44px; display: flex; align-items: flex-end; gap: 16px;">
    <span style="position: relative; display: block; width: 88px; height: 88px; flex-shrink: 0;">
      <span style="display: block; width: 88px; height: 88px; border-radius: 999px; overflow: hidden; border: 3px solid var(--canvas); background: var(--elevated);">
        <img src="./assets/d4df557aba6a1084219f527a6dc8b3dd.jpg" alt="Sua foto atual" style="width: 100%; height: 100%; object-fit: cover;">
      </span>
      <button type="button" aria-label="Trocar foto de perfil" style="position: absolute; right: -2px; bottom: -2px; width: 32px; height: 32px; border-radius: 999px; border: 2px solid var(--canvas); background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m6 16 4-4 3 3 2-2 3 3"></path></svg>
      </button>
    </span>
    <p style="margin: 0 0 8px; font-size: 12px; line-height: 1.4; color: var(--text-4); min-width: 0;">JPG ou PNG, até 5 MB.</p>
  </div>

  <form style="padding: 24px 16px; display: flex; flex-direction: column; gap: 16px;" onsubmit="{{ block }}">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="e-nome" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Nome</label>
      <input id="e-nome" type="text" defaultValue="Richard Kulkamp" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="e-user" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Usuário</label>
      <div style="position: relative;">
        <span aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 34px; height: 52px; display: flex; align-items: center; justify-content: flex-end; font-size: 16px; color: var(--text-4); pointer-events: none;">@</span>
        <input id="e-user" type="text" defaultValue="richard.k" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 44px 0 34px; font-family: inherit; font-size: 16px; color: var(--text-1);">
        <span aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 44px; height: 52px; display: flex; align-items: center; justify-content: center; color: var(--success);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
      </div>
      <span style="font-size: 12px; line-height: 1.4; color: var(--success);">Disponível</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="e-bio" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Bio</label>
      <textarea id="e-bio" rows="3" style="width: 100%; min-width: 0; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 14px 16px; font-family: inherit; font-size: 16px; line-height: 1.5; color: var(--text-1); resize: none;" defaultValue="Violão na varanda, vinil na sala. Colecionando disco e gente que gosta de tocar junto."></textarea>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="font-size: 12px; line-height: 1.4; color: var(--text-4); min-width: 0; flex-grow: 1;">Hashtags viram interesses.</span>
        <span style="font-size: 12px; line-height: 1.4; color: var(--text-5); flex-shrink: 0;">86/150</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label for="e-local" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Localização</label>
      <input id="e-local" type="text" defaultValue="São Paulo, SP" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Interesses</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{ interesses }}" as="i" hint-placeholder-count="5">
          <span style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px 0 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-2);">
            {{ i.label }}
            <button type="button" aria-label="Remover {{ i.label }}" style="width: 20px; height: 20px; border: 0; background: transparent; color: var(--text-4); display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </span>
        </sc-for>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px dashed var(--border-strong); background: transparent; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--brand-200); cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
          Adicionar
        </button>
      </div>
    </div>

  </form>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#6155F5',
      block: (e) => { e.preventDefault(); },
      interesses: [
        { label: 'Violão' }, { label: 'Vinil' }, { label: 'Produção' }, { label: 'MPB' }, { label: 'Worship' }
      ]
    };
  }
}
</script>
</body>
</html>
