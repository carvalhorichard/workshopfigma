<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Grupos — Desktop</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nav-item:hover { background: var(--surface); color: var(--text-1); }
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; background: var(--canvas); padding: 0 0 32px; display: flex; flex-direction: column; gap: 24px;">

  <header style="display: flex; align-items: center; gap: 24px; height: 80px; padding: 0 32px; flex-shrink: 0;">
    <a href="Home-Desktop.dc.html" style="font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; flex-shrink: 0;">Musique</a>
    <div style="position: relative; flex-grow: 1; max-width: 560px; min-width: 0;">
      <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar</label>
      <input id="busca" type="search" placeholder="O que deseja fazer de bom hoje?" style="width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 48px 0 16px; font-family: inherit; font-size: 14px; color: var(--text-1);">
      <span style="position: absolute; top: 0; right: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      </span>
    </div>
    <div style="flex-grow: 1;"></div>
    <button type="button" aria-label="Notificações" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
    </button>
    <a href="Perfil-Desktop.dc.html" aria-label="Seu perfil" style="display: block; width: 44px; height: 44px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
      <img src="./assets/d4df557aba6a1084219f527a6dc8b3dd.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    </a>
  </header>

  <div style="display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; padding: 0 32px; align-items: start;">

    <nav aria-label="Navegação principal" style="background: var(--surface); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a class="nav-item" href="{{ n.href }}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 12px; background: {{ n.bg }}; color: {{ n.color }}; font-size: 14px; font-weight: 500; line-height: 1.45; min-width: 0;">
          <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0;" aria-hidden="true">
            <sc-if value="{{ n.isInicio }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg></sc-if>
            <sc-if value="{{ n.isBuscar }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></sc-if>
            <sc-if value="{{ n.isMensagens }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-5A7.5 7.5 0 1 1 21 11.5Z"></path></svg></sc-if>
            <sc-if value="{{ n.isCriar }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg></sc-if>
            <sc-if value="{{ n.isGrupos }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="6.6" r="3.2"></circle><circle cx="6.4" cy="16.6" r="3.2"></circle><circle cx="17.6" cy="16.6" r="3.2"></circle></svg></sc-if>
            <sc-if value="{{ n.isPerfil }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg></sc-if>
          </span>
          <span class="one-line" style="min-width: 0; flex-grow: 1;">{{ n.label }}</span>
          <sc-if value="{{ n.badge }}" hint-placeholder-val="{{ true }}">
            <span aria-label="{{ n.badgeLabel }}" style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: {{ n.badgeBg }}; font-size: 12px; font-weight: 600; line-height: 1; color: {{ n.badgeColor }}; flex-shrink: 0;">{{ n.badge }}</span>
          </sc-if>
        </a>
      </sc-for>

      <span style="display: block; height: 1px; background: var(--border); margin: 8px 12px;"></span>

      <a class="nav-item" href="Configuracoes-Desktop.dc.html" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 12px; color: var(--text-3); font-size: 14px; font-weight: 500; line-height: 1.45; min-width: 0;">
        <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0;" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"></path></svg>
        </span>
        <span class="one-line" style="min-width: 0;">Configurações</span>
      </a>
    </nav>

    <div style="display: flex; flex-direction: column; gap: 20px; min-width: 0;">

      <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
        <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); min-width: 0;">Grupos</h1>
        <div style="flex-grow: 1;"></div>
        <div style="position: relative; width: 320px; flex-shrink: 0;">
          <label for="q-grupos" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar grupos</label>
          <input id="q-grupos" type="search" placeholder="Buscar grupos" style="width: 100%; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 16px 0 42px; font-family: inherit; font-size: 14px; color: var(--text-1);">
          <span style="position: absolute; top: 0; left: 0; width: 42px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
          </span>
        </div>
        <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: {{ accent }}; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--on-brand); cursor: pointer; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
          Criar grupo
        </button>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{ filtros }}" as="f" hint-placeholder-count="7">
          <a href="#filtro" aria-current="{{ f.current }}" style="display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid {{ f.border }}; background: {{ f.bg }}; font-size: 12px; font-weight: 500; line-height: 1.3; color: {{ f.color }};">{{ f.label }}</a>
        </sc-for>
      </div>

      <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
        <sc-for list="{{ grupos }}" as="g" hint-placeholder-count="6">
          <li style="background: var(--surface); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0;">
            <a href="Grupo-Desktop.dc.html" style="position: relative; display: block; width: 100%; aspect-ratio: 5 / 2; background: var(--elevated);">
              <img src="{{ g.cover }}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">
              <span style="position: absolute; left: 12px; bottom: -14px; display: flex; align-items: center;">
                <sc-for list="{{ g.avatars }}" as="a" hint-placeholder-count="3">
                  <span style="display: block; width: 28px; height: 28px; border-radius: 999px; overflow: hidden; border: 2px solid var(--surface); margin-left: {{ a.offset }}; background: var(--elevated);">
                    <img src="{{ a.img }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
                  </span>
                </sc-for>
              </span>
              <span style="position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; height: 26px; padding: 0 8px; border-radius: 999px; background: rgba(25, 24, 27, 0.72); border: 1px solid rgba(241, 241, 242, 0.2); font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-1);">{{ g.privacidade }}</span>
            </a>

            <div style="padding: 22px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
              <a href="Grupo-Desktop.dc.html" class="clamp2" style="font-size: 16px; line-height: 1.25; min-height: 40px; font-weight: 600; color: var(--text-1); overflow-wrap: anywhere;">{{ g.nome }}</a>

              <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap; color: var(--text-3);">
                <span style="display: inline-flex; align-items: center; gap: 8px;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="6.6" r="3.2"></circle><circle cx="6.4" cy="16.6" r="3.2"></circle><circle cx="17.6" cy="16.6" r="3.2"></circle></svg>
                  <span style="font-size: 12px; line-height: 1.4;">{{ g.grupos }}</span>
                </span>
                <span style="display: inline-flex; align-items: center; gap: 8px;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"></circle><path d="M5.5 20.2a6.5 6.5 0 0 1 13 0"></path></svg>
                  <span style="font-size: 12px; line-height: 1.4;">{{ g.membros }}</span>
                </span>
              </div>

              <div style="flex-grow: 1;"></div>
              <button type="button" style="height: 44px; border-radius: 12px; border: 1px solid {{ g.btnBorder }}; background: {{ g.btnBg }}; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.45; color: {{ g.btnColor }}; cursor: pointer;">{{ g.btnLabel }}</button>
            </div>
          </li>
        </sc-for>
      </ul>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    const accent = this.props.accent ?? '#6155F5';
    const group = (imgs) => imgs.map((img, i) => ({ img: img, offset: i === 0 ? '0px' : '-10px' }));
    const flags = { isInicio: false, isBuscar: false, isMensagens: false, isCriar: false, isGrupos: false, isPerfil: false };
    const item = (label, href, key, ativo, badge) => Object.assign({}, flags, {
      label: label,
      href: href,
      bg: ativo ? accent : 'transparent',
      color: ativo ? '#FFFFFF' : '#A2A2A2',
      badge: badge || '',
      badgeLabel: badge ? badge + ' conversas não lidas' : '',
      badgeBg: ativo ? '#FFFFFF' : accent,
      badgeColor: ativo ? accent : '#FFFFFF'
    }, (function () { const o = {}; o[key] = true; return o; })());
    const chip = (label, ativo) => ({
      label: label,
      current: ativo ? 'page' : 'false',
      bg: ativo ? 'rgba(97, 85, 245, 0.16)' : '#242326',
      border: ativo ? accent : '#37363A',
      color: ativo ? '#FFFFFF' : '#D3D3D3'
    });
    const participar = { btnBg: accent, btnBorder: accent, btnColor: '#FFFFFF', btnLabel: 'Participar' };
    const participando = { btnBg: 'transparent', btnBorder: '#4A494E', btnColor: '#D3D3D3', btnLabel: 'Participando' };
    const solicitar = { btnBg: 'transparent', btnBorder: '#4A494E', btnColor: '#D3D3D3', btnLabel: 'Solicitar entrada' };

    const a1 = B('d4df557aba6a1084219f527a6dc8b3dd');
    const a2 = B('b9d0e0c6462917737af4f43af3d11f54');
    const a3 = B('d70eb4949c16dfb88fa72b50e071ea33');
    const a5 = B('c3f310aced94019c5ebbb4f27e509d6a');
    const a6 = B('67c575cd532301cb170ebf415148a249');
    const a7 = B('562fa5e0b44c2bfb4966d048a0e0a5cc');
    const a9 = B('81f87a851d7bc9e765031d78a4ed61f7');
    const a10 = B('45bbabe584bfbec2ef0d732c9551a6da');

    return {
      accent: accent,
      nav: [
        item('Início', 'Home-Desktop.dc.html', 'isInicio', false, ''),
        item('Buscar', 'Buscar-Desktop.dc.html', 'isBuscar', false, ''),
        item('Mensagens', 'Mensagens-Desktop.dc.html', 'isMensagens', false, '2'),
        item('Criar', 'Criar-Desktop.dc.html', 'isCriar', false, ''),
        item('Grupos', '#grupos', 'isGrupos', true, ''),
        item('Perfil', 'Perfil-Desktop.dc.html', 'isPerfil', false, '')
      ],
      filtros: [
        chip('Todos', true), chip('Participando', false), chip('Sugeridos', false),
        chip('Violão', false), chip('Produção', false), chip('Vinil', false), chip('Worship', false)
      ],
      grupos: [
        Object.assign({ nome: 'Violão e Voz', cover: B('8c05828cc80395269ce165e1604d7d12'), grupos: '43 grupos', membros: '975 membros', privacidade: 'Público', avatars: group([a7, a1, a9]) }, participando),
        Object.assign({ nome: 'Produção Musical', cover: B('ca781dd1e6445e3b373de9a2db61e75c'), grupos: '23 grupos', membros: '750 membros', privacidade: 'Público', avatars: group([a6, a3, a2]) }, participar),
        Object.assign({ nome: 'Vinis & Discos', cover: B('d340387bc462a18fd4d3603e74d519d3'), grupos: '15 grupos', membros: '396 membros', privacidade: 'Público', avatars: group([a2, a10, a1]) }, participar),
        Object.assign({ nome: 'Worship & Música', cover: B('1c45bb5535bd1f83c2b2eaa4093bdd81'), grupos: '34 grupos', membros: '4,1 mil membros', privacidade: 'Público', avatars: group([a2, a5, a6]) }, participando),
        Object.assign({ nome: 'Baixo & Groove', cover: B('d61651c279f88cfd0222407c4e7a9485'), grupos: '22 grupos', membros: '3,4 mil membros', privacidade: 'Público', avatars: group([a10, a9, a3]) }, participar),
        Object.assign({ nome: 'Estúdio Fechado', cover: B('895249eb24946ccc16df6b0e65584e98'), grupos: '8 grupos', membros: '164 membros', privacidade: 'Privado', avatars: group([a6, a9, a7]) }, solicitar)
      ]
    };
  }
}
</script>
</body>
</html>
