<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Perfil de outra pessoa — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1240px; box-sizing: border-box; background: var(--canvas); padding: 0 0 104px; display: flex; flex-direction: column; gap: 20px;">

  <div style="position: relative; width: 100%; height: 148px; background: var(--elevated); flex-shrink: 0;">
    <img src="./assets/8c05828cc80395269ce165e1604d7d12.jpg" alt="Capa do perfil: parede de violões" style="width: 100%; height: 100%; object-fit: cover;">
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 88px; background: linear-gradient(180deg, rgba(25, 24, 27, 0.66) 0%, rgba(25, 24, 27, 0) 100%);"></div>
    <a href="Buscar-Mobile.dc.html" aria-label="Voltar" style="position: absolute; top: 12px; left: 12px; width: 44px; height: 44px; border-radius: 999px; background: rgba(25, 24, 27, 0.6); border: 1px solid rgba(241, 241, 242, 0.2); color: var(--on-brand); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <button type="button" aria-label="Mais opções do perfil" style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 999px; background: rgba(25, 24, 27, 0.6); border: 1px solid rgba(241, 241, 242, 0.2); color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle></svg>
    </button>
  </div>

  <div style="position: relative; z-index: 1; display: flex; flex-direction: column; gap: 16px; padding: 0 16px; margin-top: -52px;">

    <span style="display: block; width: 88px; height: 88px; border-radius: 999px; overflow: hidden; border: 3px solid var(--canvas); background: var(--elevated);">
      <img src="./assets/562fa5e0b44c2bfb4966d048a0e0a5cc.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    </span>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; overflow-wrap: anywhere;">João Prado</h1>
      <span style="font-size: 14px; line-height: 1.45; color: var(--text-4);">@joao_violao</span>
      <p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: var(--text-2); overflow-wrap: anywhere;">Professor de violão. Levada simples, música honesta. Criador do Violão e Voz.</p>
      <div style="display: flex; align-items: center; gap: 8px; color: var(--text-4);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"></path><circle cx="12" cy="10" r="2.6"></circle></svg>
        <span class="one-line" style="font-size: 12px; line-height: 1.4; min-width: 0;">Curitiba, PR</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
        <a href="{{ s.href }}" style="display: flex; align-items: baseline; gap: 4px; min-width: 0;">
          <span style="font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-1);">{{ s.valor }}</span>
          <span style="font-size: 14px; line-height: 1.45; color: var(--text-4);">{{ s.label }}</span>
        </a>
      </sc-for>
    </div>

    <a href="#seguidores" style="display: flex; align-items: center; gap: 8px; min-width: 0;">
      <span style="display: flex; align-items: center;">
        <sc-for list="{{ emComum }}" as="a" hint-placeholder-count="3">
          <span style="display: block; width: 26px; height: 26px; border-radius: 999px; overflow: hidden; border: 2px solid var(--canvas); margin-left: {{ a.offset }}; background: var(--elevated);">
            <img src="{{ a.img }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
          </span>
        </sc-for>
      </span>
      <span class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--text-4); min-width: 0;">Seguido por Elina, Marina e mais 12</span>
    </a>

    <div style="display: flex; align-items: center; gap: 8px;">
      <button type="button" style="flex-grow: 1; min-width: 0; height: 48px; border-radius: 12px; border: 0; background: {{ accent }}; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--on-brand); cursor: pointer;">Seguir</button>
      <a href="Chat-Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; flex-grow: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--border-strong); font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text-2);">Mensagem</a>
      <button type="button" aria-label="Compartilhar perfil" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4"></path><path d="M12 2v14"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-4);">Interesses</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{ interesses }}" as="i" hint-placeholder-count="4">
          <a href="Buscar-Mobile.dc.html" style="display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-2);">{{ i.label }}</a>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; gap: 20px; border-bottom: 1px solid var(--elevated);">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <a href="#tab" aria-current="{{ t.current }}" style="font-size: 14px; font-weight: {{ t.peso }}; line-height: 1.45; color: {{ t.color }}; padding: 12px 0; border-bottom: 2px solid {{ t.borda }};">{{ t.label }}</a>
      </sc-for>
    </div>

  </div>

  <div style="padding: 0 16px;">
    <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="9">
        <li style="min-width: 0;">
          <a href="#post" style="display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: var(--elevated);">
            <img src="{{ p.img }}" alt="{{ p.alt }}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">
          </a>
        </li>
      </sc-for>
    </ul>
  </div>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; padding: 8px 16px 20px; background: var(--canvas); border-top: 1px solid var(--elevated); display: flex; align-items: center; justify-content: space-between; gap: 4px;">
    <a href="Home-Mobile.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg>
    </a>
    <a href="Buscar-Mobile.dc.html" aria-label="Buscar" aria-current="page" style="width: 56px; height: 44px; border-radius: 16px; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
    </a>
    <a href="Criar-Mobile.dc.html" aria-label="Criar publicação" style="width: 56px; height: 56px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); color: var(--text-1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
    </a>
    <a href="Mensagens-Mobile.dc.html" aria-label="Mensagens, 2 conversas não lidas" style="position: relative; width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-5A7.5 7.5 0 1 1 21 11.5Z"></path></svg>
      <span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: {{ accent }}; border: 2px solid var(--canvas); font-size: 12px; font-weight: 600; line-height: 1; color: var(--on-brand);">2</span>
    </a>
    <a href="Perfil-Mobile.dc.html" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    const accent = this.props.accent ?? '#6155F5';
    const tab = (label, ativo) => ({
      label: label,
      current: ativo ? 'page' : 'false',
      peso: ativo ? '600' : '500',
      color: ativo ? '#F1F1F2' : '#858487',
      borda: ativo ? accent : 'transparent'
    });

    return {
      accent: accent,
      stats: [
        { valor: '96', label: 'publicações', href: '#publicacoes' },
        { valor: '3.480', label: 'seguidores', href: '#seguidores' },
        { valor: '210', label: 'seguindo', href: '#seguindo' }
      ],
      emComum: [
        B('b9d0e0c6462917737af4f43af3d11f54'),
        B('d70eb4949c16dfb88fa72b50e071ea33'),
        B('81f87a851d7bc9e765031d78a4ed61f7')
      ].map((img, i) => ({ img: img, offset: i === 0 ? '0px' : '-10px' })),
      interesses: [{ label: 'Violão' }, { label: 'MPB' }, { label: 'Fingerstyle' }, { label: 'Ensino' }],
      tabs: [tab('Publicações', true), tab('Grupos', false), tab('Sobre', false)],
      posts: [
        { img: B('d1498bd93cbbf34e4b76f4d75558d29a'), alt: 'Mão dedilhando um violão' },
        { img: B('8c05828cc80395269ce165e1604d7d12'), alt: 'Parede de violões' },
        { img: B('64967519fa908662372a9f97fab22320'), alt: 'Partitura sobre a estante' },
        { img: B('daa3492d772f18df8d7599a12f3f9e6f'), alt: 'Violão em luz baixa' },
        { img: B('d659d089e44384c1286f544fda088827'), alt: 'Guitarra azul-esverdeada' },
        { img: B('ca781dd1e6445e3b373de9a2db61e75c'), alt: 'Mesa de áudio no estúdio' },
        { img: B('d340387bc462a18fd4d3603e74d519d3'), alt: 'Toca-discos com planta ao lado' },
        { img: B('895249eb24946ccc16df6b0e65584e98'), alt: 'Estúdio em luz roxa' },
        { img: B('d61651c279f88cfd0222407c4e7a9485'), alt: 'Baixo vermelho apoiado na parede' }
      ]
    };
  }
}
</script>
</body>
</html>
