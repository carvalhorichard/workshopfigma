<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reações — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 560px; box-sizing: border-box; background: var(--canvas); overflow: hidden;">

  <img src="./assets/aa13cde3e83f53040acbe5eea59bf935.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
  <div style="position: absolute; inset: 0; background: rgba(18, 17, 20, 0.82);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="reacoes-titulo" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 20px 20px 0 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 16px 12px; flex-shrink: 0;">
      <span aria-hidden="true" style="display: block; width: 40px; height: 4px; border-radius: 999px; background: var(--border-strong);"></span>
      <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
        <h1 id="reacoes-titulo" style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-1); min-width: 0;">Reagir</h1>
        <div style="flex-grow: 1;"></div>
        <a href="Post-Detalhe-Mobile.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; margin-right: -12px; border-radius: 999px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </a>
      </div>
    </div>

    <div style="padding: 0 16px 16px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{ emojis }}" as="e" hint-placeholder-count="10">
        <button type="button" aria-label="{{ e.label }}" aria-pressed="{{ e.ativo }}" style="height: 56px; border-radius: 16px; border: 1px solid {{ e.borda }}; background: {{ e.bg }}; font-size: 26px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <span aria-hidden="true">{{ e.emoji }}</span>
        </button>
      </sc-for>
    </div>

    <span style="display: block; height: 1px; background: var(--elevated); margin: 0 16px;"></span>

    <section aria-labelledby="quem-reagiu" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <h2 id="quem-reagiu" style="margin: 0; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-4);">Quem reagiu</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px;">
        <sc-for list="{{ pessoas }}" as="p" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 12px; min-width: 0;">
            <span style="position: relative; display: block; width: 40px; height: 40px; flex-shrink: 0;">
              <span style="display: block; width: 40px; height: 40px; border-radius: 999px; overflow: hidden; background: var(--elevated);">
                <img src="{{ p.avatar }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
              </span>
              <span aria-hidden="true" style="position: absolute; right: -4px; bottom: -4px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; background: var(--surface); border: 2px solid var(--surface); font-size: 13px; line-height: 1;">{{ p.emoji }}</span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
              <span class="one-line" style="font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--text-1);">{{ p.nome }}</span>
              <span class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--text-4);">{{ p.handle }}</span>
            </span>
          </li>
        </sc-for>
      </ul>
    </section>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    const accent = this.props.accent ?? '#6155F5';
    const off = { ativo: 'false', bg: '#2C2B2F', borda: '#4A494E' };
    const on = { ativo: 'true', bg: 'rgba(97, 85, 245, 0.2)', borda: accent };

    return {
      accent: accent,
      emojis: [
        Object.assign({ emoji: '❤️', label: 'Amei' }, on),
        Object.assign({ emoji: '👏', label: 'Palmas' }, off),
        Object.assign({ emoji: '💪', label: 'Força' }, off),
        Object.assign({ emoji: '🔥', label: 'Demais' }, off),
        Object.assign({ emoji: '🎸', label: 'Instrumento' }, off),
        Object.assign({ emoji: '😊', label: 'Gostei' }, off),
        Object.assign({ emoji: '😍', label: 'Apaixonei' }, off),
        Object.assign({ emoji: '🙌', label: 'Isso' }, off),
        Object.assign({ emoji: '✨', label: 'Lindo' }, off),
        Object.assign({ emoji: '💯', label: 'Top' }, off)
      ],
      pessoas: [
        { nome: 'João Prado', handle: '@joao_violao', emoji: '❤️', avatar: B('562fa5e0b44c2bfb4966d048a0e0a5cc') },
        { nome: 'Marina Alves', handle: '@marina.violao', emoji: '🙌', avatar: B('d70eb4949c16dfb88fa72b50e071ea33') },
        { nome: 'Rafa Bass', handle: '@baixo_groove', emoji: '❤️', avatar: B('45bbabe584bfbec2ef0d732c9551a6da') }
      ]
    };
  }
}
</script>
</body>
</html>
