<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar publicação — Desktop</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
textarea::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; background: var(--canvas-deep); display: flex; align-items: center; justify-content: center; padding: 40px;">

  <div role="dialog" aria-modal="true" aria-labelledby="criar-titulo" style="width: 720px; max-height: 100%; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; overflow: hidden;">

    <header style="display: flex; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--elevated); flex-shrink: 0;">
      <h1 id="criar-titulo" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1); min-width: 0;">Nova publicação</h1>
      <div style="flex-grow: 1;"></div>
      <a href="Home-Desktop.dc.html" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </header>

    <div style="padding: 24px; display: flex; flex-direction: column; gap: 20px; min-width: 0;">

      <div role="group" aria-label="Tipo de conteúdo" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--elevated); align-self: flex-start;">
        <a href="#publicacao" aria-current="page" style="height: 40px; padding: 0 24px; border-radius: 8px; background: {{ accent }}; color: var(--on-brand); font-size: 14px; font-weight: 600; line-height: 1.45; display: flex; align-items: center; justify-content: center;">Publicação</a>
        <a href="#story" style="height: 40px; padding: 0 24px; border-radius: 8px; color: var(--text-3); font-size: 14px; font-weight: 500; line-height: 1.45; display: flex; align-items: center; justify-content: center;">Story</a>
      </div>

      <div style="display: flex; gap: 20px; min-width: 0;">

        <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0; flex-grow: 1;">

          <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
            <span style="display: block; width: 44px; height: 44px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
              <img src="./assets/d4df557aba6a1084219f527a6dc8b3dd.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
            </span>
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1;">
              <span class="one-line" style="font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text-1);">Richard</span>
              <button type="button" style="display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; height: 28px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-2); cursor: pointer;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"></circle><path d="M5.5 20.2a6.5 6.5 0 0 1 13 0"></path></svg>
                Seguidores
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6-6 6"></path></svg>
              </button>
            </div>
          </div>

          <div>
            <label for="legenda" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Legenda da publicação</label>
            <textarea id="legenda" rows="5" placeholder="Conta pra gente. Use #hashtags pra virar tag." style="width: 100%; min-width: 0; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 14px 16px; font-family: inherit; font-size: 16px; line-height: 1.5; color: var(--text-1); resize: none;" defaultValue="Achei esse gramofone num sebo hoje. Ainda toca. #vinil #achado"></textarea>
          </div>

          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{ tags }}" as="t" hint-placeholder-count="2">
              <span style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--brand-200);">
                {{ t.label }}
                <button type="button" aria-label="Remover {{ t.label }}" style="width: 16px; height: 16px; border: 0; background: transparent; color: var(--text-4); display: flex; align-items: center; justify-content: center; cursor: pointer;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </button>
              </span>
            </sc-for>
          </div>

          <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px;">
            <sc-for list="{{ opcoes }}" as="o" hint-placeholder-count="3">
              <li>
                <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; font-family: inherit; cursor: pointer; text-align: left;">
                  <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; color: var(--text-3); flex-shrink: 0;" aria-hidden="true">
                    <sc-if value="{{ o.isPessoas }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.6a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"></path><circle cx="9.5" cy="7.5" r="3.4"></circle><path d="M19 8v6M22 11h-6"></path></svg></sc-if>
                    <sc-if value="{{ o.isLocal }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"></path><circle cx="12" cy="10" r="2.6"></circle></svg></sc-if>
                    <sc-if value="{{ o.isGrupo }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="6.6" r="3.2"></circle><circle cx="6.4" cy="16.6" r="3.2"></circle><circle cx="17.6" cy="16.6" r="3.2"></circle></svg></sc-if>
                  </span>
                  <span class="one-line" style="font-size: 14px; line-height: 1.45; color: var(--text-2); min-width: 0; flex-grow: 1;">{{ o.label }}</span>
                  <span class="one-line" style="font-size: 14px; line-height: 1.45; color: {{ o.valorCor }}; min-width: 0; max-width: 50%; text-align: right;">{{ o.valor }}</span>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#858487" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
                </button>
              </li>
            </sc-for>
          </ul>

        </div>

        <div style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px;">
          <div style="position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; background: var(--elevated);">
            <img src="./assets/aa4851cf0928a68badd254199ce10193.jpg" alt="Prévia da mídia selecionada: gramofone dourado" style="width: 100%; height: 100%; object-fit: cover;">
            <button type="button" aria-label="Remover mídia" style="position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 999px; border: 1px solid rgba(241, 241, 242, 0.24); background: rgba(25, 24, 27, 0.72); color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
          <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 12px; border: 1px dashed var(--border-strong); background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--text-2); cursor: pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m6 16 4-4 3 3 2-2 3 3"></path></svg>
            Trocar mídia
          </button>
        </div>

      </div>

    </div>

    <footer style="display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-top: 1px solid var(--elevated); flex-shrink: 0;">
      <span style="font-size: 12px; line-height: 1.4; color: var(--text-4); min-width: 0;">Vai para o feed e para o grupo Vinis &amp; Discos.</span>
      <div style="flex-grow: 1;"></div>
      <a href="Home-Desktop.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--border-strong); font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--text-2); flex-shrink: 0;">Cancelar</a>
      <a href="Home-Desktop.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 24px; border-radius: 12px; background: {{ accent }}; font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--on-brand); flex-shrink: 0;">Publicar</a>
    </footer>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#6155F5',
      tags: [{ label: '#vinil' }, { label: '#achado' }],
      opcoes: [
        { label: 'Marcar pessoas', valor: '', valorCor: '#858487', isPessoas: true, isLocal: false, isGrupo: false },
        { label: 'Local', valor: 'São Paulo, SP', valorCor: '#858487', isPessoas: false, isLocal: true, isGrupo: false },
        { label: 'Grupo', valor: 'Vinis & Discos', valorCor: '#B6B1FF', isPessoas: false, isLocal: false, isGrupo: true }
      ]
    };
  }
}
</script>
</body>
</html>
