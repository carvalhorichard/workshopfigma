<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Home carregando — Desktop</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { background: var(--surface); color: var(--text-1); }
.sk { background: var(--elevated); border-radius: 8px; animation: sk-pulse 1.6s ease-in-out infinite; }
@keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; opacity: 0.8; } }
</style>
</helmet>
<div style="width: 1440px; height: 1200px; box-sizing: border-box; background: var(--canvas); padding: 0 0 32px; display: flex; flex-direction: column; gap: 24px;">

  <header style="display: flex; align-items: center; gap: 24px; height: 80px; padding: 0 32px; flex-shrink: 0;">
    <span style="font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; flex-shrink: 0;">Musique</span>
    <div style="position: relative; flex-grow: 1; max-width: 560px; min-width: 0;">
      <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar</label>
      <input id="busca" type="search" placeholder="O que deseja fazer de bom hoje?" style="width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 48px 0 16px; font-family: inherit; font-size: 14px; color: var(--text-1);">
      <span style="position: absolute; top: 0; right: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      </span>
    </div>
    <div style="flex-grow: 1;"></div>
    <span class="sk" style="display: block; width: 220px; height: 16px;"></span>
    <span class="sk" style="display: block; width: 24px; height: 24px; border-radius: 999px;"></span>
    <span class="sk" style="display: block; width: 44px; height: 44px; border-radius: 999px;"></span>
  </header>

  <section aria-busy="true" aria-label="Carregando stories" style="flex-shrink: 0;">
    <div style="display: flex; gap: 16px; padding: 0 32px; overflow: hidden;">
      <sc-for list="{{ dez }}" as="s" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 8px; width: 135px; flex-shrink: 0;">
          <span class="sk" style="display: block; width: 135px; height: 180px; border-radius: 20px;"></span>
          <span class="sk" style="display: block; width: 88px; height: 12px; margin-inline: auto;"></span>
        </div>
      </sc-for>
    </div>
  </section>

  <div style="display: grid; grid-template-columns: 260px minmax(0, 1fr) 420px; gap: 24px; padding: 0 32px; align-items: start;">

    <nav aria-label="Navegação principal" style="background: var(--surface); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
      <a class="nav-item" href="Home-Mobile.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 12px; background: {{ accent }}; color: var(--on-brand); font-size: 14px; font-weight: 500; line-height: 1.45;">
        <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0;" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg></span>
        <span class="one-line" style="min-width: 0;">Início</span>
      </a>
      <sc-for list="{{ navResto }}" as="n" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px;">
          <span class="sk" style="display: block; width: 20px; height: 20px; flex-shrink: 0;"></span>
          <span class="sk" style="display: block; width: {{ n.w }}; height: 14px;"></span>
        </div>
      </sc-for>
    </nav>

    <section aria-busy="true" aria-label="Carregando publicações" style="display: flex; flex-direction: column; gap: 24px; min-width: 0;">
      <sc-for list="{{ dois }}" as="p" hint-placeholder-count="2">
        <div style="background: var(--surface); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span class="sk" style="display: block; width: 44px; height: 44px; border-radius: 999px; flex-shrink: 0;"></span>
            <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0;">
              <span class="sk" style="display: block; width: 152px; height: 16px;"></span>
              <span class="sk" style="display: block; width: 104px; height: 12px;"></span>
            </div>
          </div>
          <span class="sk" style="display: block; width: 100%; height: 16px;"></span>
          <span class="sk" style="display: block; width: 64%; height: 16px;"></span>
          <div style="display: flex; gap: 8px;">
            <span class="sk" style="display: block; width: 80px; height: 32px; border-radius: 999px;"></span>
            <span class="sk" style="display: block; width: 96px; height: 32px; border-radius: 999px;"></span>
            <span class="sk" style="display: block; width: 120px; height: 32px; border-radius: 999px;"></span>
          </div>
          <span class="sk" style="display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px;"></span>
          <div style="display: flex; align-items: center; gap: 16px;">
            <span class="sk" style="display: block; width: 72px; height: 20px;"></span>
            <span class="sk" style="display: block; width: 72px; height: 20px;"></span>
            <div style="flex-grow: 1;"></div>
            <span class="sk" style="display: block; width: 22px; height: 22px;"></span>
          </div>
        </div>
      </sc-for>
    </section>

    <aside aria-busy="true" aria-label="Carregando comunidades" style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 24px;">
        <span class="sk" style="display: block; width: 128px; height: 18px;"></span>
        <span class="sk" style="display: block; width: 72px; height: 18px;"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
        <sc-for list="{{ quatro }}" as="c" hint-placeholder-count="4">
          <div style="background: var(--surface); border-radius: 16px; overflow: hidden; min-width: 0;">
            <span class="sk" style="display: block; width: 100%; aspect-ratio: 5 / 2; border-radius: 0;"></span>
            <div style="padding: 22px 12px 12px; display: flex; flex-direction: column; gap: 8px;">
              <span class="sk" style="display: block; width: 88%; height: 16px;"></span>
              <span class="sk" style="display: block; width: 64%; height: 12px;"></span>
              <span class="sk" style="display: block; width: 72%; height: 12px;"></span>
            </div>
          </div>
        </sc-for>
      </div>
    </aside>

  </div>

  <p style="margin: 0; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;" role="status">Carregando o feed…</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#6155F5',
      dois: [{}, {}],
      quatro: [{}, {}, {}, {}],
      dez: [{}, {}, {}, {}, {}, {}, {}, {}, {}, {}],
      navResto: [{ w: '64px' }, { w: '96px' }, { w: '56px' }, { w: '68px' }, { w: '58px' }]
    };
  }
}
</script>
</body>
</html>
