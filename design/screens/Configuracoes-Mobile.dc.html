<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row:hover { background: var(--elevated); }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; box-sizing: border-box; background: var(--canvas); display: flex; flex-direction: column; gap: 24px;">

  <header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--elevated); flex-shrink: 0;">
    <a href="Perfil-Mobile.dc.html" aria-label="Voltar para o perfil" style="width: 44px; height: 44px; margin-left: -12px; border-radius: 999px; color: var(--text-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-1); min-width: 0;">Configurações</h1>
  </header>

  <div style="padding: 0 16px;">
    <a href="Perfil-Mobile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--surface); min-width: 0;">
      <span style="display: block; width: 56px; height: 56px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
        <img src="./assets/d4df557aba6a1084219f527a6dc8b3dd.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1;">
        <span class="one-line" style="font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-1);">Richard Kulkamp</span>
        <span class="one-line" style="font-size: 14px; line-height: 1.45; color: var(--text-4);">@richard.k</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#858487" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <sc-for list="{{ secoes }}" as="s" hint-placeholder-count="3">
    <section aria-label="{{ s.titulo }}" style="display: flex; flex-direction: column; gap: 8px;">
      <h2 style="margin: 0; padding: 0 16px; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-4);">{{ s.titulo }}</h2>
      <ul style="margin: 0; padding: 0 8px; list-style: none; display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{ s.itens }}" as="i" hint-placeholder-count="3">
          <li>
            <a class="row" href="{{ i.href }}" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 12px; border-radius: 12px; min-width: 0;">
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
                <span class="one-line" style="font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--text-2);">{{ i.label }}</span>
                <sc-if value="{{ i.valor }}" hint-placeholder-val="{{ true }}">
                  <span class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--text-4);">{{ i.valor }}</span>
                </sc-if>
              </span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#858487" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </sc-for>

  <div style="padding: 8px 8px 0;">
    <a class="row" href="Sair-Mobile.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 12px; border-radius: 12px; min-width: 0;">
      <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; color: var(--error); flex-shrink: 0;" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"></path><path d="M15 8.5 19 12l-4 3.5"></path><path d="M19 12H9.5"></path></svg>
      </span>
      <span class="one-line" style="font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--error); min-width: 0; flex-grow: 1;">Sair da conta</span>
    </a>
  </div>

  <div style="flex-grow: 1;"></div>

  <p style="margin: 0; padding: 0 16px 24px; text-align: center; font-size: 12px; line-height: 1.4; color: var(--text-5);">Musique 1.0.0 · feito para ouvir junto</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#6155F5',
      secoes: [
        {
          titulo: 'Conta',
          itens: [
            { label: 'Alterar e-mail', valor: 'richard@email.com', href: '#email' },
            { label: 'Alterar senha', valor: 'Trocada há 3 meses', href: '#senha' },
            { label: 'Privacidade da conta', valor: 'Pública', href: '#privacidade' }
          ]
        },
        {
          titulo: 'Preferências',
          itens: [
            { label: 'Notificações', valor: 'Curtidas, comentários e menções', href: 'Notificacoes-Mobile.dc.html' },
            { label: 'Aparência', valor: 'Escuro', href: '#aparencia' },
            { label: 'Idioma', valor: 'Português (Brasil)', href: '#idioma' }
          ]
        },
        {
          titulo: 'Suporte',
          itens: [
            { label: 'Ajuda', valor: '', href: '#ajuda' },
            { label: 'Termos de uso', valor: '', href: '#termos' },
            { label: 'Política de privacidade', valor: '', href: '#politica' }
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
