<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cadastro — Desktop</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
input::placeholder { color: var(--text-4); }
input:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
img { max-width: 100%; display: block; }
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: var(--canvas); padding: 24px; display: flex; gap: 24px;">

  <div style="position: relative; flex-grow: 1; min-width: 0; border-radius: 20px; overflow: hidden; background: var(--surface);">
    <img src="./assets/aa4851cf0928a68badd254199ce10193.jpg" alt="Gramofone dourado em uma oficina" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%;">
  </div>

  <div style="position: relative; width: 480px; flex-shrink: 0; border-radius: 20px; background: var(--surface); padding: 40px; display: flex; flex-direction: column;">

    <a href="Login-Desktop.dc.html" aria-label="Voltar para o login" style="position: absolute; top: 24px; left: 24px; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--elevated); color: var(--text-2); display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; flex-direction: column; gap: 28px;">

      <div style="display: flex; flex-direction: column; gap: 12px; text-align: center;">
        <h1 style="margin: 0; font-size: 32px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.4px;">Criar conta</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.5; color: var(--text-3); max-width: 32ch; margin-inline: auto;">Leva menos de um minuto. Depois é só escolher suas comunidades.</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: 12px;" onsubmit="{{ block }}">

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
            <label for="cd-nome" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Nome</label>
            <input id="cd-nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
            <label for="cd-user" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Usuário</label>
            <input id="cd-user" name="usuario" type="text" autocomplete="username" placeholder="@seunome" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="cd-email" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">E-mail</label>
          <input id="cd-email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="cd-senha" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Senha</label>
          <input id="cd-senha" name="senha" type="password" autocomplete="new-password" placeholder="••••••••" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
          <span style="font-size: 12px; line-height: 1.4; color: var(--text-4);">Mínimo de 8 caracteres.</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="cd-senha2" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Confirmar senha</label>
          <input id="cd-senha2" name="senha2" type="password" autocomplete="new-password" placeholder="••••••••" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
        </div>

        <div style="display: flex; align-items: flex-start; gap: 8px; min-height: 44px; padding-top: 4px;">
          <input id="cd-termos" type="checkbox" style="width: 20px; height: 20px; accent-color: {{ accent }}; margin: 2px 0 0; flex-shrink: 0;">
          <label for="cd-termos" style="font-size: 14px; line-height: 1.5; color: var(--text-2); min-width: 0;">Li e aceito os <a href="#termos">Termos de uso</a> e a <a href="#privacidade">Política de privacidade</a>.</label>
        </div>

        <a href="Home-Desktop.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: {{ accent }}; color: var(--on-brand); font-size: 16px; font-weight: 600; line-height: 1.5; margin-top: 4px;">Criar minha conta</a>
      </form>

      <div style="display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;">
        <span style="font-size: 14px; line-height: 1.5; color: var(--text-4);">Já tem conta?</span>
        <a href="Login-Desktop.dc.html" style="font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--brand-200);">Entrar</a>
      </div>

    </div>

    <div style="flex-grow: 1;"></div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#6155F5',
      block: (e) => { e.preventDefault(); }
    };
  }
}
</script>
</body>
</html>
