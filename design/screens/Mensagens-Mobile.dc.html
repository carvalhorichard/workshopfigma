<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mensagens — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--canvas); padding: 0 0 104px; display: flex; flex-direction: column; gap: 16px;">

  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 0;">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; min-width: 0;">Mensagens</h1>
    <div style="flex-grow: 1;"></div>
    <button type="button" aria-label="Nova conversa" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.8a2.1 2.1 0 0 1 3 3L9 17.3l-4 1 1-4Z"></path><path d="M14 6.5 17.5 10"></path></svg>
    </button>
  </header>

  <div style="position: relative; padding: 0 16px;">
    <label for="q-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar conversas</label>
    <input id="q-msg" type="search" placeholder="Buscar conversas" style="width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 16px 0 46px; font-family: inherit; font-size: 14px; color: var(--text-1);">
    <span style="position: absolute; top: 0; left: 16px; width: 46px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
    </span>
  </div>

  <ul style="margin: 0; padding: 0 8px; list-style: none; display: flex; flex-direction: column; gap: 2px;">
    <sc-for list="{{ conversas }}" as="c" hint-placeholder-count="6">
      <li>
        <a href="Chat-Mobile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-radius: 16px; background: {{ c.rowBg }}; min-width: 0;">
          <span style="position: relative; display: block; width: 52px; height: 52px; flex-shrink: 0;">
            <span style="display: block; width: 52px; height: 52px; border-radius: 999px; overflow: hidden; background: var(--elevated);">
              <img src="{{ c.avatar }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
            </span>
            <sc-if value="{{ c.online }}" hint-placeholder-val="{{ true }}">
              <span style="position: absolute; right: 1px; bottom: 1px; width: 14px; height: 14px; border-radius: 999px; background: var(--success); border: 2px solid var(--canvas);"></span>
            </sc-if>
          </span>

          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1;">
            <span style="display: flex; align-items: baseline; gap: 8px; min-width: 0;">
              <span class="one-line" style="font-size: 15px; font-weight: {{ c.nomePeso }}; line-height: 1.3; color: var(--text-1); min-width: 0; flex-grow: 1;">{{ c.nome }}</span>
              <span style="font-size: 12px; line-height: 1.4; color: {{ c.horaCor }}; flex-shrink: 0;">{{ c.hora }}</span>
            </span>
            <span style="display: flex; align-items: center; gap: 8px; min-width: 0;">
              <span class="one-line" style="font-size: 14px; line-height: 1.45; color: {{ c.previewCor }}; min-width: 0; flex-grow: 1;">{{ c.preview }}</span>
              <sc-if value="{{ c.naoLidas }}" hint-placeholder-val="{{ true }}">
                <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: {{ accent }}; font-size: 12px; font-weight: 600; line-height: 1; color: var(--on-brand); flex-shrink: 0;">{{ c.naoLidas }}</span>
              </sc-if>
            </span>
          </span>
        </a>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; padding: 8px 16px 20px; background: var(--canvas); border-top: 1px solid var(--elevated); display: flex; align-items: center; justify-content: space-between; gap: 4px;">
    <a href="Home-Mobile.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg>
    </a>
    <a href="Buscar-Mobile.dc.html" aria-label="Buscar" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
    </a>
    <a href="Criar-Mobile.dc.html" aria-label="Criar publicação" style="width: 56px; height: 56px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); color: var(--text-1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
    </a>
    <a href="#mensagens" aria-label="Mensagens" aria-current="page" style="width: 56px; height: 44px; border-radius: 16px; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-5A7.5 7.5 0 1 1 21 11.5Z"></path></svg>
    </a>
    <a href="Perfil-Mobile.dc.html" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    const accent = this.props.accent ?? '#6155F5';
    const naoLida = { rowBg: '#242326', nomePeso: '600', previewCor: '#D3D3D3', horaCor: accent };
    const lida = { rowBg: 'transparent', nomePeso: '500', previewCor: '#858487', horaCor: '#626166' };

    return {
      accent: accent,
      conversas: [
        Object.assign({ nome: 'Elina Castro', avatar: B('b9d0e0c6462917737af4f43af3d11f54'), preview: 'Achei o disco que você procurava!', hora: '5 min', online: true, naoLidas: '2' }, naoLida),
        Object.assign({ nome: 'Estúdio Nove', avatar: B('67c575cd532301cb170ebf415148a249'), preview: 'Mando a mix hoje à noite', hora: '22 min', online: true, naoLidas: '1' }, naoLida),
        Object.assign({ nome: 'João Prado', avatar: B('562fa5e0b44c2bfb4966d048a0e0a5cc'), preview: 'Você: fechou, sábado então', hora: '2 h', online: false, naoLidas: '' }, lida),
        Object.assign({ nome: 'Marina Alves', avatar: B('d70eb4949c16dfb88fa72b50e071ea33'), preview: 'Obrigada pela indicação 🙏', hora: 'Ontem', online: false, naoLidas: '' }, lida),
        Object.assign({ nome: 'Dani Prod', avatar: B('155252e34381c0fec8937ba1dec254c2'), preview: 'Você: manda o take cru', hora: 'Ter', online: false, naoLidas: '' }, lida),
        Object.assign({ nome: 'Rafa Bass', avatar: B('45bbabe584bfbec2ef0d732c9551a6da'), preview: 'Bora ensaiar essa semana?', hora: 'Seg', online: false, naoLidas: '' }, lida)
      ]
    };
  }
}
</script>
</body>
</html>
