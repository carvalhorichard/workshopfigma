<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story Viewer — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--text-1); outline-offset: 2px; }
input::placeholder { color: var(--text-2-dim); }
img { max-width: 100%; display: block; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--canvas); overflow: hidden;">

  <img src="./assets/aa4851cf0928a68badd254199ce10193.jpg" alt="Story de @elina321: gramofone dourado em uma oficina" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%;">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 200px; background: linear-gradient(180deg, rgba(25, 24, 27, 0.78) 0%, rgba(25, 24, 27, 0) 100%);"></div>
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 280px; background: linear-gradient(0deg, rgba(25, 24, 27, 0.86) 0%, rgba(25, 24, 27, 0) 100%);"></div>

  <button type="button" aria-label="Story anterior" style="position: absolute; left: 0; top: 96px; bottom: 168px; width: 120px; border: 0; background: transparent; cursor: pointer;"></button>
  <button type="button" aria-label="Próximo story" style="position: absolute; right: 0; top: 96px; bottom: 168px; width: 120px; border: 0; background: transparent; cursor: pointer;"></button>

  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 4px;" role="group" aria-label="Progresso dos stories">
      <sc-for list="{{ progress }}" as="b" hint-placeholder-count="5">
        <span style="flex-grow: 1; height: 3px; border-radius: 999px; background: rgba(241, 241, 242, 0.32); overflow: hidden;">
          <span style="display: block; height: 100%; width: {{ b.fill }}; background: var(--text-1); border-radius: 999px;"></span>
        </span>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="#perfil" style="display: block; width: 40px; height: 40px; border-radius: 999px; overflow: hidden; flex-shrink: 0; border: 2px solid rgba(241, 241, 242, 0.9);">
        <img src="./assets/b9d0e0c6462917737af4f43af3d11f54.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
      </a>
      <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-grow: 1;">
        <a href="#perfil" class="one-line" style="font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--on-brand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">@elina321</a>
        <span style="font-size: 12px; line-height: 1.4; color: var(--text-2); flex-shrink: 0;">2 h</span>
      </div>
      <button type="button" aria-label="Pausar story" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9.5 5v14M14.5 5v14"></path></svg>
      </button>
      <button type="button" aria-label="Fechar stories" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px;">

    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: var(--on-brand); overflow-wrap: anywhere; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);">Achei esse gramofone num sebo hoje. Ainda toca. 🎺</p>

    <div style="display: flex; gap: 8px;">
      <sc-for list="{{ reactions }}" as="r" hint-placeholder-count="4">
        <button type="button" aria-label="{{ r.label }}" style="width: 52px; height: 52px; border-radius: 999px; border: 1px solid rgba(241, 241, 242, 0.24); background: rgba(25, 24, 27, 0.52); font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <span aria-hidden="true">{{ r.emoji }}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="flex-grow: 1; min-width: 0;">
        <label for="reply" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Responder ao story</label>
        <input id="reply" type="text" placeholder="Responder a @elina321…" style="width: 100%; min-width: 0; height: 52px; border-radius: 999px; border: 1px solid rgba(241, 241, 242, 0.32); background: rgba(25, 24, 27, 0.52); padding: 0 20px; font-family: inherit; font-size: 14px; color: var(--on-brand);">
      </div>
      <button type="button" aria-label="Enviar resposta" style="width: 52px; height: 52px; border-radius: 999px; border: 0; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 20 4l-7.5 16-2-6.5Z"></path></svg>
      </button>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#6155F5',
      progress: [
        { fill: '100%' }, { fill: '100%' }, { fill: '46%' }, { fill: '0%' }, { fill: '0%' }
      ],
      reactions: [
        { emoji: '❤️', label: 'Amei' },
        { emoji: '👏', label: 'Palmas' },
        { emoji: '🔥', label: 'Demais' },
        { emoji: '😍', label: 'Apaixonei' }
      ]
    };
  }
}
</script>
</body>
</html>
