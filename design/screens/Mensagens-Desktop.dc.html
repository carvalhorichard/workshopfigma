<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mensagens — Desktop</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { background: var(--surface); color: var(--text-1); }
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: var(--canvas); padding: 0 0 32px; display: flex; flex-direction: column; gap: 24px;">

  <header style="display: flex; align-items: center; gap: 24px; height: 80px; padding: 0 32px; flex-shrink: 0;">
    <a href="Home-Desktop.dc.html" style="font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; flex-shrink: 0;">Musique</a>

    <div style="position: relative; flex-grow: 1; max-width: 560px; min-width: 0;">
      <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar</label>
      <input id="busca" type="search" placeholder="O que deseja fazer de bom hoje?" style="width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 48px 0 16px; font-family: inherit; font-size: 14px; color: var(--text-1);">
      <span style="position: absolute; top: 0; right: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      </span>
    </div>

    <div style="flex-grow: 1;"></div>

    <button type="button" aria-label="Notificações" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
    </button>

    <a href="Perfil-Desktop.dc.html" aria-label="Seu perfil" style="display: block; width: 44px; height: 44px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
      <img src="./assets/d4df557aba6a1084219f527a6dc8b3dd.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    </a>
  </header>

  <div style="display: grid; grid-template-columns: 260px 340px minmax(0, 1fr); gap: 24px; padding: 0 32px; align-items: stretch; flex-grow: 1; min-height: 0;">

    <nav aria-label="Navegação principal" style="background: var(--surface); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px; align-self: start;">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a class="nav-item" href="{{ n.href }}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 12px; background: {{ n.bg }}; color: {{ n.color }}; font-size: 14px; font-weight: 500; line-height: 1.45; min-width: 0;">
          <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0;" aria-hidden="true">
            <sc-if value="{{ n.isInicio }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg></sc-if>
            <sc-if value="{{ n.isBuscar }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></sc-if>
            <sc-if value="{{ n.isMensagens }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-5A7.5 7.5 0 1 1 21 11.5Z"></path></svg></sc-if>
            <sc-if value="{{ n.isCriar }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg></sc-if>
            <sc-if value="{{ n.isGrupos }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="6.6" r="3.2"></circle><circle cx="6.4" cy="16.6" r="3.2"></circle><circle cx="17.6" cy="16.6" r="3.2"></circle></svg></sc-if>
            <sc-if value="{{ n.isPerfil }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg></sc-if>
          </span>
          <span class="one-line" style="min-width: 0; flex-grow: 1;">{{ n.label }}</span>
          <sc-if value="{{ n.badge }}" hint-placeholder-val="{{ true }}">
            <span aria-label="{{ n.badgeLabel }}" style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: {{ n.badgeBg }}; font-size: 12px; font-weight: 600; line-height: 1; color: {{ n.badgeColor }}; flex-shrink: 0;">{{ n.badge }}</span>
          </sc-if>
        </a>
      </sc-for>

      <span style="display: block; height: 1px; background: var(--border); margin: 8px 12px;"></span>

      <a class="nav-item" href="Configuracoes-Desktop.dc.html" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 12px; color: var(--text-3); font-size: 14px; font-weight: 500; line-height: 1.45; min-width: 0;">
        <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0;" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"></path></svg>
        </span>
        <span class="one-line" style="min-width: 0;">Configurações</span>
      </a>
    </nav>

    <section aria-label="Conversas" style="background: var(--surface); border-radius: 20px; padding: 16px 8px 8px; display: flex; flex-direction: column; gap: 12px; min-width: 0; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 8px;">
        <h1 style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1); min-width: 0;">Mensagens</h1>
        <div style="flex-grow: 1;"></div>
        <button type="button" aria-label="Nova conversa" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.8a2.1 2.1 0 0 1 3 3L9 17.3l-4 1 1-4Z"></path><path d="M14 6.5 17.5 10"></path></svg>
        </button>
      </div>

      <div style="position: relative; padding: 0 8px;">
        <label for="q-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar conversas</label>
        <input id="q-msg" type="search" placeholder="Buscar conversas" style="width: 100%; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 0 16px 0 42px; font-family: inherit; font-size: 14px; color: var(--text-1);">
        <span style="position: absolute; top: 0; left: 8px; width: 42px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
        </span>
      </div>

      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <sc-for list="{{ conversas }}" as="c" hint-placeholder-count="6">
          <li>
            <a href="#conversa" style="display: flex; align-items: center; gap: 12px; padding: 8px 8px; border-radius: 12px; background: {{ c.rowBg }}; min-width: 0;">
              <span style="position: relative; display: block; width: 44px; height: 44px; flex-shrink: 0;">
                <span style="display: block; width: 44px; height: 44px; border-radius: 999px; overflow: hidden; background: var(--border);">
                  <img src="{{ c.avatar }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
                </span>
                <sc-if value="{{ c.online }}" hint-placeholder-val="{{ true }}">
                  <span style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 999px; background: var(--success); border: 2px solid var(--surface);"></span>
                </sc-if>
              </span>
              <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1;">
                <span style="display: flex; align-items: baseline; gap: 8px; min-width: 0;">
                  <span class="one-line" style="font-size: 14px; font-weight: {{ c.nomePeso }}; line-height: 1.45; color: var(--text-1); min-width: 0; flex-grow: 1;">{{ c.nome }}</span>
                  <span style="font-size: 12px; line-height: 1.4; color: {{ c.horaCor }}; flex-shrink: 0;">{{ c.hora }}</span>
                </span>
                <span style="display: flex; align-items: center; gap: 8px; min-width: 0;">
                  <span class="one-line" style="font-size: 12px; line-height: 1.4; color: {{ c.previewCor }}; min-width: 0; flex-grow: 1;">{{ c.preview }}</span>
                  <sc-if value="{{ c.naoLidas }}" hint-placeholder-val="{{ true }}">
                    <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: {{ accent }}; font-size: 12px; font-weight: 600; line-height: 1; color: var(--on-brand); flex-shrink: 0;">{{ c.naoLidas }}</span>
                  </sc-if>
                </span>
              </span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>

    <section aria-label="Conversa com Elina Castro" style="background: var(--surface); border-radius: 20px; display: flex; flex-direction: column; min-width: 0; overflow: hidden;">

      <header style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--elevated); flex-shrink: 0;">
        <a href="#perfil" style="position: relative; display: block; width: 44px; height: 44px; flex-shrink: 0;">
          <span style="display: block; width: 44px; height: 44px; border-radius: 999px; overflow: hidden; background: var(--border);">
            <img src="./assets/b9d0e0c6462917737af4f43af3d11f54.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
          </span>
          <span style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 999px; background: var(--success); border: 2px solid var(--surface);"></span>
        </a>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-grow: 1;">
          <a href="#perfil" class="one-line" style="font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-1);">Elina Castro</a>
          <span class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--success);">online</span>
        </div>
        <button type="button" aria-label="Informações da conversa" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 7.6h.01"></path></svg>
        </button>
      </header>

      <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;">

        <div style="display: flex; align-items: center; gap: 12px; padding: 4px 0 8px;">
          <span style="flex-grow: 1; height: 1px; background: var(--elevated);"></span>
          <span style="font-size: 12px; line-height: 1.4; color: var(--text-5); flex-shrink: 0;">Hoje</span>
          <span style="flex-grow: 1; height: 1px; background: var(--elevated);"></span>
        </div>

        <sc-for list="{{ mensagens }}" as="m" hint-placeholder-count="6">
          <div style="display: flex; justify-content: {{ m.align }}; min-width: 0;">
            <div style="max-width: 64%; min-width: 0; padding: 8px 14px; border-radius: 16px; border-bottom-right-radius: {{ m.brRight }}; border-bottom-left-radius: {{ m.brLeft }}; background: {{ m.bg }}; display: flex; flex-direction: column; gap: 4px;">
              <p style="margin: 0; font-size: 14px; line-height: 1.5; color: {{ m.color }}; overflow-wrap: anywhere;">{{ m.texto }}</p>
              <span style="font-size: 12px; line-height: 1.3; color: {{ m.horaCor }}; align-self: flex-end;">{{ m.hora }}</span>
            </div>
          </div>
        </sc-for>

      </div>

      <div style="padding: 12px 20px 20px; border-top: 1px solid var(--elevated); display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
        <button type="button" aria-label="Anexar mídia" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m6 16 4-4 3 3 2-2 3 3"></path></svg>
        </button>
        <div style="position: relative; flex-grow: 1; min-width: 0;">
          <label for="msg-d" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Escreva uma mensagem</label>
          <input id="msg-d" type="text" placeholder="Escreva uma mensagem" style="width: 100%; min-width: 0; height: 48px; border-radius: 999px; border: 1px solid var(--border); background: var(--elevated); padding: 0 46px 0 18px; font-family: inherit; font-size: 14px; color: var(--text-1);">
          <button type="button" aria-label="Inserir emoji" style="position: absolute; top: 2px; right: 2px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 10h.01M15 10h.01M8.5 14.5a4.5 4.5 0 0 0 7 0"></path></svg>
          </button>
        </div>
        <button type="button" aria-label="Enviar mensagem" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 20 4l-7.5 16-2-6.5Z"></path></svg>
        </button>
      </div>

    </section>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    const accent = this.props.accent ?? '#6155F5';
    const flags = { isInicio: false, isBuscar: false, isMensagens: false, isCriar: false, isGrupos: false, isPerfil: false };
    const item = (label, href, key, ativo, badge) => Object.assign({}, flags, {

    const ativa = { rowBg: '#2C2B2F', nomePeso: '600', previewCor: '#D3D3D3', horaCor: accent };
    const naoLida = { rowBg: 'transparent', nomePeso: '600', previewCor: '#D3D3D3', horaCor: accent };

    const recebida = { align: 'flex-start', bg: '#2C2B2F', color: '#D3D3D3', horaCor: '#858487', brLeft: '4px', brRight: '16px' };

    return {

      nav: [
        item('Início', 'Home-Desktop.dc.html', 'isInicio', false),
        item('Buscar', 'Buscar-Desktop.dc.html', 'isBuscar', false),

      ],

        Object.assign({ nome: 'Marina Alves', avatar: B('d70eb4949c16dfb88fa72b50e071ea33'), preview: 'Obrigada pela indicação 🙏', hora: 'Ontem', online: false, naoLidas: '1' }, naoLida),
        Object.assign({ nome: 'Dani Prod', avatar: B('155252e34381c0fec8937ba1dec254c2'), preview: 'Você: manda o take cru', hora: 'Ter', online: false, naoLidas: '' }, lida),
        Object.assign({ nome: 'Rafa Bass', avatar: B('45bbabe584bfbec2ef0d732c9551a6da'), preview: 'Bora ensaiar essa semana?', hora: 'Seg', online: false, naoLidas: '' }, lida)
      ],
      mensagens: [
        Object.assign({ texto: 'Passei no sebo da Augusta hoje', hora: '14:02' }, recebida),
