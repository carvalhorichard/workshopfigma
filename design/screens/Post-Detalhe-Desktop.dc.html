<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Publicação — Desktop</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; background: var(--canvas-deep); display: flex; align-items: center; justify-content: center; padding: 40px;">

  <a href="Home-Desktop.dc.html" aria-label="Fechar publicação" style="position: absolute; top: 24px; right: 32px; width: 48px; height: 48px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); display: flex; align-items: center; justify-content: center;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </a>

  <div role="dialog" aria-modal="true" aria-labelledby="post-autor" style="display: flex; width: 1200px; height: 800px; border-radius: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--border);">

    <div style="width: 720px; flex-shrink: 0; background: var(--canvas-deep); display: flex; align-items: center; justify-content: center;">
      <img src="./assets/aa13cde3e83f53040acbe5eea59bf935.jpg" alt="Parede de loja com dezenas de discos de vinil" style="width: 100%; height: 100%; object-fit: contain;">
    </div>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">

      <header style="display: flex; align-items: center; gap: 12px; padding: 20px; border-bottom: 1px solid var(--elevated); flex-shrink: 0;">
        <a href="Perfil-Desktop.dc.html" style="display: block; width: 44px; height: 44px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
          <img src="./assets/b9d0e0c6462917737af4f43af3d11f54.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
        </a>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
          <a id="post-autor" href="Perfil-Desktop.dc.html" class="one-line" style="font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-1);">@elina321</a>
          <a href="Grupo-Desktop.dc.html" class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--text-4);">5 min · Vinis &amp; Discos</a>
        </div>
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 12px; border: 0; background: {{ accent }}; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--on-brand); cursor: pointer; flex-shrink: 0;">Seguir</button>
        <button type="button" aria-label="Mais opções da publicação" style="width: 36px; height: 36px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle></svg>
        </button>
      </header>

      <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 20px;">

        <div style="display: flex; align-items: flex-start; gap: 12px; min-width: 0;">
          <a href="Perfil-Desktop.dc.html" style="display: block; width: 36px; height: 36px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
            <img src="./assets/b9d0e0c6462917737af4f43af3d11f54.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
          </a>
          <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; flex-grow: 1;">
            <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-2); overflow-wrap: anywhere;"><a href="Perfil-Desktop.dc.html" style="font-weight: 600; color: var(--text-1);">@elina321</a> Minha coleção cresceu esse mês. Alguma recomendação pro próximo? <a href="#mencao" style="color: var(--brand-300); font-weight: 500;">@vinilclube</a> 💛</p>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              <sc-for list="{{ tags }}" as="t" hint-placeholder-count="3">
                <a href="Buscar-Desktop.dc.html" style="display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--brand-200);">{{ t.label }}</a>
              </sc-for>
            </div>
          </div>
        </div>

        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 20px;">
          <sc-for list="{{ comentarios }}" as="c" hint-placeholder-count="4">
            <li style="display: flex; align-items: flex-start; gap: 12px; min-width: 0; margin-left: {{ c.recuo }};">
              <a href="Perfil-Desktop.dc.html" style="display: block; width: {{ c.avatarSize }}; height: {{ c.avatarSize }}; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
                <img src="{{ c.avatar }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
              </a>
              <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1;">
                <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-2); overflow-wrap: anywhere;"><a href="Perfil-Desktop.dc.html" style="font-weight: 600; color: var(--text-1);">{{ c.handle }}</a> {{ c.texto }}</p>
                <div style="display: flex; align-items: center; gap: 16px;">
                  <span style="font-size: 12px; line-height: 1.4; color: var(--text-5);">{{ c.tempo }}</span>
                  <button type="button" style="border: 0; background: transparent; padding: 4px 0; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-4); cursor: pointer;">Responder</button>
                  <sc-if value="{{ c.respostas }}" hint-placeholder-val="{{ true }}">
                    <button type="button" style="border: 0; background: transparent; padding: 4px 0; font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--brand-200); cursor: pointer;">{{ c.respostas }}</button>
                  </sc-if>
                </div>
              </div>
              <button type="button" aria-label="Curtir comentário" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 32px; border: 0; background: transparent; color: {{ c.curtidaCor }}; cursor: pointer; flex-shrink: 0;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="{{ c.curtidaFill }}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.4 4.6 13a4.5 4.5 0 0 1 6.4-6.3l1 1 1-1A4.5 4.5 0 1 1 19.4 13Z"></path></svg>
                <span style="font-size: 12px; line-height: 1.3;">{{ c.curtidas }}</span>
              </button>
            </li>
          </sc-for>
        </ul>

      </div>

      <div style="padding: 16px 20px; border-top: 1px solid var(--elevated); display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;">

        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{ reacoes }}" as="r" hint-placeholder-count="2">
            <button type="button" aria-label="{{ r.label }}, {{ r.count }}" style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); font-family: inherit; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-2); cursor: pointer;">
              <span aria-hidden="true">{{ r.emoji }}</span>
              <span aria-hidden="true">{{ r.count }}</span>
            </button>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border-radius: 12px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--text-2); cursor: pointer;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.4 4.6 13a4.5 4.5 0 0 1 6.4-6.3l1 1 1-1A4.5 4.5 0 1 1 19.4 13Z"></path></svg>
            <span>248</span>
          </button>
          <button type="button" aria-label="Reagir" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 10h.01M15 10h.01M8.5 14.5a4.5 4.5 0 0 0 7 0"></path></svg>
          </button>
          <button type="button" aria-label="Compartilhar" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16c0-6 5-8 10-8V4l6 6-6 6v-4c-4 0-8 .8-10 4Z"></path></svg>
          </button>
          <div style="flex-grow: 1;"></div>
          <button type="button" aria-label="Salvar publicação" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1Z"></path></svg>
          </button>
        </div>

        <p style="margin: 0; font-size: 12px; line-height: 1.4; color: var(--text-5);">Hoje, 14:32 · São Paulo, SP</p>

        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="position: relative; flex-grow: 1; min-width: 0;">
            <label for="comentario-d" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Escreva um comentário</label>
            <input id="comentario-d" type="text" placeholder="Comentar como @richard.k" style="width: 100%; min-width: 0; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--elevated); padding: 0 44px 0 16px; font-family: inherit; font-size: 14px; color: var(--text-1);">
            <button type="button" aria-label="Inserir emoji" style="position: absolute; top: 0; right: 0; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 10h.01M15 10h.01M8.5 14.5a4.5 4.5 0 0 0 7 0"></path></svg>
            </button>
          </div>
          <button type="button" aria-label="Enviar comentário" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 20 4l-7.5 16-2-6.5Z"></path></svg>
          </button>
        </div>

      </div>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    const accent = this.props.accent ?? '#6155F5';
    const raiz = { recuo: '0px', avatarSize: '36px' };
    const resposta = { recuo: '48px', avatarSize: '28px' };
    const curtido = { curtidaCor: accent, curtidaFill: accent };
    const neutro = { curtidaCor: '#858487', curtidaFill: 'none' };

    return {
      accent: accent,
      tags: [{ label: '#disco' }, { label: '#vinil' }, { label: '#comunidade' }],
      reacoes: [
        { emoji: '❤️', count: '12', label: 'Amei' },
        { emoji: '🙌', count: '8', label: 'Demais' }
      ],
      comentarios: [
        Object.assign({ handle: '@joao_violao', tempo: '4 min', texto: 'Se achar um Clube da Esquina original, não pensa duas vezes.', curtidas: '12', respostas: '', avatar: B('562fa5e0b44c2bfb4966d048a0e0a5cc') }, raiz, curtido),
        Object.assign({ handle: '@elina321', tempo: '3 min', texto: 'Tava justamente atrás desse! Obrigada 🙏', curtidas: '3', respostas: '', avatar: B('b9d0e0c6462917737af4f43af3d11f54') }, resposta, neutro),
        Object.assign({ handle: '@estudio_nove', tempo: '3 min', texto: 'Que prateleira linda. Onde fica esse sebo?', curtidas: '4', respostas: 'Ver 1 resposta', avatar: B('67c575cd532301cb170ebf415148a249') }, raiz, neutro),
        Object.assign({ handle: '@marina.violao', tempo: '1 min', texto: 'Tenho um sobrando aqui, te mando foto depois 😄', curtidas: '2', respostas: '', avatar: B('d70eb4949c16dfb88fa72b50e071ea33') }, raiz, neutro)
      ]
    };
  }
}
</script>
</body>
</html>
