<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Busca sem resultado — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.rail { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 900px; box-sizing: border-box; background: var(--canvas); padding: 0 0 104px; display: flex; flex-direction: column; gap: 20px;">

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 0;">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px;">Buscar</h1>
    <div style="position: relative;">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar pessoas e grupos</label>
      <input id="q" type="search" value="xilofone" placeholder="O que deseja fazer de bom hoje?" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 48px 0 46px; font-family: inherit; font-size: 16px; color: var(--text-1);">
      <span style="position: absolute; top: 0; left: 0; width: 46px; height: 52px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      </span>
      <button type="button" aria-label="Limpar busca" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
  </div>

  <section aria-labelledby="sem-resultado" style="padding: 0 16px;">
    <div style="background: var(--surface); border-radius: 16px; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;">
      <span style="display: flex; align-items: center; justify-content: center; width: 88px; height: 88px; border-radius: 999px; background: var(--elevated); color: var(--text-4);" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path><path d="M8.2 10.5h4.6"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h2 id="sem-resultado" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1); overflow-wrap: anywhere;">Nenhum resultado para “xilofone”</h2>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-3); max-width: 34ch;">Confira a escrita ou tente um termo mais amplo, como o instrumento ou o estilo.</p>
      </div>
      <button type="button" style="display: flex; align-items: center; justify-content: center; height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--border-strong); background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text-2); cursor: pointer;">Limpar busca</button>
    </div>
  </section>

  <section aria-labelledby="tente" style="display: flex; flex-direction: column; gap: 12px;">
    <h2 id="tente" style="margin: 0; padding: 0 16px; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1);">Tente por aqui</h2>
    <div class="rail" style="width: 100%;">
      <div style="display: flex; gap: 8px; padding: 0 16px; width: max-content;">
        <sc-for list="{{ sugestoes }}" as="s" hint-placeholder-count="6">
          <a href="Buscar-Mobile.dc.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-2); flex-shrink: 0;">{{ s.label }}</a>
        </sc-for>
      </div>
    </div>
  </section>

  <section aria-labelledby="populares" style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px;">
    <h2 id="populares" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1);">Grupos em alta</h2>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{ grupos }}" as="g" hint-placeholder-count="2">
        <li style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 16px; background: var(--surface);">
          <a href="Grupo-Mobile.dc.html" style="display: block; width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
            <img src="{{ g.cover }}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">
          </a>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1;">
            <a href="Grupo-Mobile.dc.html" class="one-line" style="font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text-1);">{{ g.nome }}</a>
            <span class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--text-4);">{{ g.membros }}</span>
          </div>
          <button type="button" style="height: 40px; padding: 0 16px; border-radius: 12px; border: 0; background: {{ accent }}; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--on-brand); cursor: pointer; flex-shrink: 0;">Participar</button>
        </li>
      </sc-for>
    </ul>
  </section>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; padding: 8px 16px 20px; background: var(--canvas); border-top: 1px solid var(--elevated); display: flex; align-items: center; justify-content: space-between; gap: 4px;">
    <a href="Home-Mobile.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg>
    </a>
    <a href="Buscar-Mobile.dc.html" aria-label="Buscar" aria-current="page" style="width: 56px; height: 44px; border-radius: 16px; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
    </a>
    <a href="Criar-Mobile.dc.html" aria-label="Criar publicação" style="width: 56px; height: 56px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); color: var(--text-1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
    </a>
    <a href="Mensagens-Mobile.dc.html" aria-label="Mensagens, 2 conversas não lidas" style="position: relative; width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-5A7.5 7.5 0 1 1 21 11.5Z"></path></svg>
      <span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: {{ accent }}; border: 2px solid var(--canvas); font-size: 12px; font-weight: 600; line-height: 1; color: var(--on-brand);">2</span>
    </a>
    <a href="Perfil-Mobile.dc.html" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    return {
      accent: this.props.accent ?? '#6155F5',
      sugestoes: [
        { label: 'percussão' }, { label: 'violão' }, { label: 'teclado' },
        { label: 'produção musical' }, { label: 'vinil' }, { label: 'worship' }
      ],
      grupos: [
        { nome: 'Violão e Voz', membros: '975 membros', cover: B('8c05828cc80395269ce165e1604d7d12') },
        { nome: 'Produção Musical', membros: '750 membros', cover: B('ca781dd1e6445e3b373de9a2db61e75c') }
      ]
    };
  }
}
</script>
</body>
</html>
