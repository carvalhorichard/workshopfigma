<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Home carregando — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
img { max-width: 100%; display: block; }
.sk { background: var(--elevated); border-radius: 8px; animation: sk-pulse 1.6s ease-in-out infinite; }
@keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; opacity: 0.8; } }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1700px; box-sizing: border-box; background: var(--canvas); padding: 0 0 104px; display: flex; flex-direction: column; gap: 24px;">

  <header style="display: flex; align-items: center; gap: 12px; padding: 16px; height: 68px; flex-shrink: 0;">
    <span style="font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px;">Musique</span>
    <div style="flex-grow: 1;"></div>
    <span class="sk" style="display: block; width: 24px; height: 24px; border-radius: 999px;"></span>
    <span class="sk" style="display: block; width: 24px; height: 24px; border-radius: 999px; margin-left: 16px;"></span>
    <span class="sk" style="display: block; width: 40px; height: 40px; border-radius: 999px; margin-left: 16px;"></span>
  </header>

  <section aria-busy="true" aria-label="Carregando stories" style="flex-shrink: 0;">
    <div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden;">
      <sc-for list="{{ quatro }}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 8px; width: 104px; flex-shrink: 0;">
          <span class="sk" style="display: block; width: 104px; height: 152px; border-radius: 20px;"></span>
          <span class="sk" style="display: block; width: 72px; height: 12px; margin-inline: auto;"></span>
        </div>
      </sc-for>
    </div>
  </section>

  <section aria-busy="true" aria-label="Carregando comunidades" style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;">
    <div style="padding: 0 16px;">
      <span class="sk" style="display: block; width: 148px; height: 22px;"></span>
    </div>
    <div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden;">
      <sc-for list="{{ tres }}" as="c" hint-placeholder-count="3">
        <div style="width: 168px; flex-shrink: 0; background: var(--surface); border-radius: 16px; overflow: hidden;">
          <span class="sk" style="display: block; width: 100%; height: 84px; border-radius: 0;"></span>
          <div style="padding: 22px 12px 12px; display: flex; flex-direction: column; gap: 8px;">
            <span class="sk" style="display: block; width: 120px; height: 16px;"></span>
            <span class="sk" style="display: block; width: 88px; height: 12px;"></span>
            <span class="sk" style="display: block; width: 96px; height: 12px;"></span>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section aria-busy="true" aria-label="Carregando publicações" style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px;">
    <sc-for list="{{ dois }}" as="p" hint-placeholder-count="2">
      <div style="background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="sk" style="display: block; width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0;"></span>
          <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 0;">
            <span class="sk" style="display: block; width: 132px; height: 14px;"></span>
            <span class="sk" style="display: block; width: 88px; height: 12px;"></span>
          </div>
        </div>
        <span class="sk" style="display: block; width: 100%; height: 14px;"></span>
        <span class="sk" style="display: block; width: 72%; height: 14px;"></span>
        <div style="display: flex; gap: 8px;">
          <span class="sk" style="display: block; width: 76px; height: 30px; border-radius: 999px;"></span>
          <span class="sk" style="display: block; width: 92px; height: 30px; border-radius: 999px;"></span>
        </div>
        <span class="sk" style="display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 12px;"></span>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span class="sk" style="display: block; width: 112px; height: 14px;"></span>
          <div style="flex-grow: 1;"></div>
          <span class="sk" style="display: block; width: 22px; height: 22px;"></span>
          <span class="sk" style="display: block; width: 22px; height: 22px;"></span>
          <span class="sk" style="display: block; width: 22px; height: 22px;"></span>
        </div>
      </div>
    </sc-for>
  </section>

  <p style="margin: 0; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;" role="status">Carregando o feed…</p>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; padding: 8px 16px 20px; background: var(--canvas); border-top: 1px solid var(--elevated); display: flex; align-items: center; justify-content: space-between; gap: 4px;">
    <a href="Home-Mobile.dc.html" aria-label="Início" aria-current="page" style="width: 56px; height: 44px; border-radius: 16px; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg>
    </a>
    <a href="Buscar-Mobile.dc.html" aria-label="Buscar" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
    </a>
    <a href="Criar-Mobile.dc.html" aria-label="Criar publicação" style="width: 56px; height: 56px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); color: var(--text-1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
    </a>
    <a href="Mensagens-Mobile.dc.html" aria-label="Mensagens, 2 conversas não lidas" style="position: relative; width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-5A7.5 7.5 0 1 1 21 11.5Z"></path></svg>
      <span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: {{ accent }}; border: 2px solid var(--canvas); font-size: 12px; font-weight: 600; line-height: 1; color: var(--on-brand);">2</span>
    </a>
    <a href="Perfil-Mobile.dc.html" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#6155F5',
      dois: [{}, {}],
      tres: [{}, {}, {}],
      quatro: [{}, {}, {}, {}]
    };
  }
}
</script>
</body>
</html>
