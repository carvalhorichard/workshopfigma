<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Buscar — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.rail { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; box-sizing: border-box; background: var(--canvas); padding: 0 0 104px; display: flex; flex-direction: column; gap: 20px;">

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 0;">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px;">Buscar</h1>

    <div style="position: relative;">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar pessoas e grupos</label>
      <input id="q" type="search" value="violão" placeholder="O que deseja fazer de bom hoje?" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 48px 0 46px; font-family: inherit; font-size: 16px; color: var(--text-1);">
      <span style="position: absolute; top: 0; left: 0; width: 46px; height: 52px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      </span>
      <button type="button" aria-label="Limpar busca" style="position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
  </div>

  <div class="rail" style="width: 100%; flex-shrink: 0;">
    <div style="display: flex; gap: 8px; padding: 0 16px; width: max-content;">
      <sc-for list="{{ recentes }}" as="c" hint-placeholder-count="5">
        <a href="#busca" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{ c.border }}; background: {{ c.bg }}; font-size: 12px; font-weight: 500; line-height: 1.3; color: {{ c.color }}; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg>
          {{ c.label }}
        </a>
      </sc-for>
    </div>
  </div>

  <section aria-labelledby="sec-pessoas" style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <h2 id="sec-pessoas" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1); min-width: 0;">Pessoas</h2>
      <div style="flex-grow: 1;"></div>
      <a href="#pessoas" style="font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--brand-200); flex-shrink: 0;">Ver todas</a>
    </div>

    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{ pessoas }}" as="p" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 16px; background: var(--surface);">
          <a href="#perfil" style="display: block; width: 48px; height: 48px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
            <img src="{{ p.avatar }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
          </a>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
            <a href="#perfil" class="one-line" style="font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text-1);">{{ p.nome }}</a>
            <span class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--text-4);">{{ p.handle }} · {{ p.contexto }}</span>
          </div>
          <button type="button" style="height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid {{ p.btnBorder }}; background: {{ p.btnBg }}; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.3; color: {{ p.btnColor }}; cursor: pointer; flex-shrink: 0;">{{ p.btnLabel }}</button>
        </li>
      </sc-for>
    </ul>
  </section>

  <section aria-labelledby="sec-grupos" style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <h2 id="sec-grupos" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1); min-width: 0;">Grupos</h2>
      <div style="flex-grow: 1;"></div>
      <a href="Grupos-Mobile.dc.html" style="font-size: 14px; font-weight: 500; line-height: 1.45; color: var(--brand-200); flex-shrink: 0;">Ver todos</a>
    </div>

    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{ grupos }}" as="g" hint-placeholder-count="3">
        <li style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 16px; background: var(--surface);">
          <a href="#grupo" style="display: block; width: 56px; height: 56px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
            <img src="{{ g.cover }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
          </a>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1;">
            <a href="#grupo" class="one-line" style="font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text-1);">{{ g.nome }}</a>
            <div style="display: flex; align-items: center; gap: 8px; color: var(--text-4); min-width: 0;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"></circle><path d="M5.5 20.2a6.5 6.5 0 0 1 13 0"></path></svg>
              <span class="one-line" style="font-size: 12px; line-height: 1.4; min-width: 0;">{{ g.membros }} · {{ g.privacidade }}</span>
            </div>
          </div>
          <button type="button" style="height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid {{ g.btnBorder }}; background: {{ g.btnBg }}; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.3; color: {{ g.btnColor }}; cursor: pointer; flex-shrink: 0;">{{ g.btnLabel }}</button>
        </li>
      </sc-for>
    </ul>
  </section>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; padding: 8px 16px 20px; background: var(--canvas); border-top: 1px solid var(--elevated); display: flex; align-items: center; justify-content: space-between; gap: 4px;">
    <a href="Home-Mobile.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg>
    </a>
    <a href="#buscar" aria-label="Buscar" aria-current="page" style="width: 56px; height: 44px; border-radius: 16px; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
    </a>
    <a href="Criar-Mobile.dc.html" aria-label="Criar publicação" style="width: 56px; height: 56px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--elevated); color: var(--text-1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
    </a>
    <a href="Mensagens-Mobile.dc.html" aria-label="Mensagens, 2 conversas não lidas" style="position: relative; width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-5A7.5 7.5 0 1 1 21 11.5Z"></path></svg>
      <span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: {{ accent }}; border: 2px solid var(--canvas); font-size: 12px; font-weight: 600; line-height: 1; color: var(--on-brand);">2</span>
    </a>
    <a href="Perfil-Mobile.dc.html" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 12px; color: var(--text-3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    const accent = this.props.accent ?? '#6155F5';
    const primario = { btnBg: accent, btnBorder: accent, btnColor: '#FFFFFF' };
    const neutro = { btnBg: 'transparent', btnBorder: '#4A494E', btnColor: '#D3D3D3' };

    return {
      accent: accent,
      recentes: [
        { label: 'violão', bg: 'rgba(97, 85, 245, 0.16)', border: accent, color: '#FFFFFF' },
        { label: 'produção musical', bg: '#242326', border: '#37363A', color: '#D3D3D3' },
        { label: 'vinil', bg: '#242326', border: '#37363A', color: '#D3D3D3' },
        { label: 'worship', bg: '#242326', border: '#37363A', color: '#D3D3D3' },
        { label: 'teclado', bg: '#242326', border: '#37363A', color: '#D3D3D3' }
      ],
      pessoas: [
        Object.assign({ nome: 'João Prado', handle: '@joao_violao', avatar: B('562fa5e0b44c2bfb4966d048a0e0a5cc'), contexto: 'Violão e Voz', btnLabel: 'Seguir' }, primario),
        Object.assign({ nome: 'Marina Alves', handle: '@marina.violao', avatar: B('d70eb4949c16dfb88fa72b50e071ea33'), contexto: '3 amigos em comum', btnLabel: 'Seguir' }, primario),
        Object.assign({ nome: 'Elina Castro', handle: '@elina321', avatar: B('b9d0e0c6462917737af4f43af3d11f54'), contexto: 'Você segue', btnLabel: 'Seguindo' }, neutro)
      ],
      grupos: [
        Object.assign({ nome: 'Violão e Voz', cover: B('8c05828cc80395269ce165e1604d7d12'), membros: '975 membros', privacidade: 'Público', btnLabel: 'Participar' }, primario),
        Object.assign({ nome: 'Violão Iniciantes', cover: B('64967519fa908662372a9f97fab22320'), membros: '2,1 mil membros', privacidade: 'Público', btnLabel: 'Participar' }, primario),
        Object.assign({ nome: 'Violão Clássico', cover: B('d340387bc462a18fd4d3603e74d519d3'), membros: '412 membros', privacidade: 'Privado', btnLabel: 'Solicitar' }, neutro)
      ]
    };
  }
}
</script>
</body>
</html>
