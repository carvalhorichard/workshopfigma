<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Notificações — Desktop</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row:hover { background: var(--elevated); }
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; background: var(--canvas); overflow: hidden;">

  <header style="position: relative; z-index: 2; display: flex; align-items: center; gap: 24px; height: 80px; padding: 0 32px; background: var(--canvas);">
    <a href="Home-Desktop.dc.html" style="font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; flex-shrink: 0;">Musique</a>
    <div style="position: relative; flex-grow: 1; max-width: 560px; min-width: 0;">
      <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar</label>
      <input id="busca" type="search" placeholder="O que deseja fazer de bom hoje?" style="width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 48px 0 16px; font-family: inherit; font-size: 14px; color: var(--text-1);">
      <span style="position: absolute; top: 0; right: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      </span>
    </div>
    <div style="flex-grow: 1;"></div>
    <a href="Home-Desktop.dc.html" aria-label="Fechar notificações" aria-expanded="true" style="width: 44px; height: 44px; border-radius: 999px; background: var(--elevated); color: var(--text-1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
    </a>
    <a href="Perfil-Desktop.dc.html" aria-label="Seu perfil" style="display: block; width: 44px; height: 44px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
      <img src="./assets/d4df557aba6a1084219f527a6dc8b3dd.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    </a>
  </header>

  <a href="Home-Desktop.dc.html" aria-label="Fechar notificações" style="position: absolute; left: 0; right: 0; top: 80px; bottom: 0; background: rgba(18, 17, 20, 0.7); z-index: 1;"></a>

  <div role="dialog" aria-modal="false" aria-labelledby="notif-titulo" style="position: absolute; top: 88px; right: 88px; z-index: 3; width: 440px; max-height: 760px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--elevated); flex-shrink: 0;">
      <h1 id="notif-titulo" style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-1); min-width: 0;">Notificações</h1>
      <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: {{ accent }}; font-size: 12px; font-weight: 600; line-height: 1; color: var(--on-brand); flex-shrink: 0;">3</span>
      <div style="flex-grow: 1;"></div>
      <button type="button" style="height: 36px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--brand-200); cursor: pointer; flex-shrink: 0;">Marcar como lidas</button>
    </div>

    <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 12px 8px;">
      <sc-for list="{{ grupos }}" as="g" hint-placeholder-count="2">
        <section aria-label="{{ g.titulo }}" style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px;">
          <h2 style="margin: 0; padding: 8px 12px 4px; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-4);">{{ g.titulo }}</h2>
          <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px;">
            <sc-for list="{{ g.itens }}" as="n" hint-placeholder-count="3">
              <li>
                <div class="row" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 12px; background: {{ n.bg }}; min-width: 0;">
                  <a href="Perfil-Desktop.dc.html" style="position: relative; display: block; width: 40px; height: 40px; flex-shrink: 0;">
                    <span style="display: block; width: 40px; height: 40px; border-radius: 999px; overflow: hidden; background: var(--border);">
                      <img src="{{ n.avatar }}" alt="" style="width: 100%; height: 100%; object-fit: cover;">
                    </span>
                    <span aria-hidden="true" style="position: absolute; right: -3px; bottom: -3px; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 999px; background: {{ n.iconeBg }}; color: var(--on-brand); border: 2px solid var(--surface);">
                      <sc-if value="{{ n.isCurtida }}" hint-placeholder-val="{{ true }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 20.4 4.6 13a4.5 4.5 0 0 1 6.4-6.3l1 1 1-1A4.5 4.5 0 1 1 19.4 13Z"></path></svg></sc-if>
                      <sc-if value="{{ n.isComentario }}" hint-placeholder-val="{{ true }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12Z"></path></svg></sc-if>
                      <sc-if value="{{ n.isSeguir }}" hint-placeholder-val="{{ true }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="8" r="4"></circle><path d="M4 20a7 7 0 0 1 14 0"></path></svg></sc-if>
                      <sc-if value="{{ n.isGrupo }}" hint-placeholder-val="{{ true }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="6.6" r="3.2"></circle><circle cx="6.4" cy="16.6" r="3.2"></circle><circle cx="17.6" cy="16.6" r="3.2"></circle></svg></sc-if>
                    </span>
                  </a>
                  <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex-grow: 1;">
                    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-2); overflow-wrap: anywhere;"><a href="Perfil-Desktop.dc.html" style="font-weight: 600; color: var(--text-1);">{{ n.quem }}</a> {{ n.texto }}</p>
                    <span style="font-size: 12px; line-height: 1.4; color: var(--text-5);">{{ n.tempo }}</span>
                    <sc-if value="{{ n.cta }}" hint-placeholder-val="{{ true }}">
                      <button type="button" style="align-self: flex-start; height: 36px; padding: 0 16px; border-radius: 12px; border: 1px solid {{ n.ctaBorda }}; background: {{ n.ctaBg }}; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.3; color: {{ n.ctaCor }}; cursor: pointer;">{{ n.cta }}</button>
                    </sc-if>
                  </div>
                  <sc-if value="{{ n.thumb }}" hint-placeholder-val="{{ true }}">
                    <a href="Post-Detalhe-Desktop.dc.html" style="display: block; width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: var(--border);">
                      <img src="{{ n.thumb }}" alt="" loading="lazy" style="width: 100%; height: 100%; object-fit: cover;">
                    </a>
                  </sc-if>
                  <sc-if value="{{ n.naoLida }}" hint-placeholder-val="{{ true }}">
                    <span aria-label="Não lida" style="display: block; width: 8px; height: 8px; border-radius: 999px; background: {{ accent }}; flex-shrink: 0; margin-top: 16px;"></span>
                  </sc-if>
                </div>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-for>
    </div>

    <div style="padding: 12px 20px 16px; border-top: 1px solid var(--elevated); flex-shrink: 0;">
      <a href="Notificacoes-Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; border: 1px solid var(--border-strong); font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text-2);">Ver todas</a>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    const accent = this.props.accent ?? '#6155F5';
    const tipos = { isCurtida: false, isComentario: false, isSeguir: false, isGrupo: false };
    const nova = { bg: '#2C2B2F', naoLida: true };
    const lida = { bg: 'transparent', naoLida: false };
    const semCta = { cta: '', ctaBg: '', ctaBorda: '', ctaCor: '' };
    const ctaPrim = { ctaBg: accent, ctaBorda: accent, ctaCor: '#FFFFFF' };
    const ctaNeutro = { ctaBg: 'transparent', ctaBorda: '#4A494E', ctaCor: '#D3D3D3' };
    const n = (o, tipo, extra) => Object.assign({}, tipos, o, extra, (function () { const x = {}; x[tipo] = true; return x; })());

    return {
      accent: accent,
      grupos: [
        {
          titulo: 'Hoje',
          itens: [
            n({ quem: '@joao_violao', texto: 'curtiu sua publicação.', tempo: '12 min', avatar: B('562fa5e0b44c2bfb4966d048a0e0a5cc'), thumb: B('aa13cde3e83f53040acbe5eea59bf935'), iconeBg: '#EF5B67' }, 'isCurtida', Object.assign({}, nova, semCta)),
            n({ quem: '@estudio_nove', texto: 'comentou: “Que prateleira linda. Onde fica esse sebo?”', tempo: '28 min', avatar: B('67c575cd532301cb170ebf415148a249'), thumb: B('aa13cde3e83f53040acbe5eea59bf935'), iconeBg: accent }, 'isComentario', Object.assign({}, nova, semCta)),
            n({ quem: '@marina.violao', texto: 'começou a seguir você.', tempo: '1 h', avatar: B('d70eb4949c16dfb88fa72b50e071ea33'), thumb: '', cta: 'Seguir de volta', iconeBg: '#4CCB88' }, 'isSeguir', Object.assign({}, nova, ctaPrim))
          ]
        },
        {
          titulo: 'Esta semana',
          itens: [
            n({ quem: 'Vinis & Discos', texto: 'convidou você para o grupo.', tempo: 'Ontem', avatar: B('d340387bc462a18fd4d3603e74d519d3'), thumb: '', cta: 'Ver convite', iconeBg: '#4A494E' }, 'isGrupo', Object.assign({}, lida, ctaNeutro)),
            n({ quem: '@elina321', texto: 'mencionou você em um comentário.', tempo: 'Ter', avatar: B('b9d0e0c6462917737af4f43af3d11f54'), thumb: B('8c05828cc80395269ce165e1604d7d12'), iconeBg: accent }, 'isComentario', Object.assign({}, lida, semCta))
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
