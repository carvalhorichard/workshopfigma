<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações — Desktop</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { background: var(--surface); color: var(--text-1); }
.sec:hover { background: var(--elevated); }
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; background: var(--canvas); padding: 0 0 32px; display: flex; flex-direction: column; gap: 24px;">

  <header style="display: flex; align-items: center; gap: 24px; height: 80px; padding: 0 32px; flex-shrink: 0;">
    <a href="Home-Desktop.dc.html" style="font-size: 24px; line-height: 1.2; font-weight: 700; color: var(--text-1); letter-spacing: -0.3px; flex-shrink: 0;">Musique</a>
    <div style="position: relative; flex-grow: 1; max-width: 560px; min-width: 0;">
      <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Buscar</label>
      <input id="busca" type="search" placeholder="O que deseja fazer de bom hoje?" style="width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 48px 0 16px; font-family: inherit; font-size: 14px; color: var(--text-1);">
      <span style="position: absolute; top: 0; right: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--text-3); pointer-events: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
      </span>
    </div>
    <div style="flex-grow: 1;"></div>
    <a href="Notificacoes-Desktop.dc.html" aria-label="Notificações" style="width: 44px; height: 44px; border-radius: 999px; color: var(--text-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"></path><path d="M13.7 20a2 2 0 0 1-3.4 0"></path></svg>
    </a>
    <a href="Perfil-Desktop.dc.html" aria-label="Seu perfil" style="display: block; width: 44px; height: 44px; border-radius: 999px; overflow: hidden; flex-shrink: 0; background: var(--elevated);">
      <img src="./assets/d4df557aba6a1084219f527a6dc8b3dd.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    </a>
  </header>

  <div style="display: grid; grid-template-columns: 260px 300px minmax(0, 1fr); gap: 24px; padding: 0 32px; align-items: start;">

    <nav aria-label="Navegação principal" style="background: var(--surface); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
        <a class="nav-item" href="{{ n.href }}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 12px; color: var(--text-3); font-size: 14px; font-weight: 500; line-height: 1.45; min-width: 0;">
          <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0;" aria-hidden="true">
            <sc-if value="{{ n.isInicio }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1Z"></path></svg></sc-if>
            <sc-if value="{{ n.isBuscar }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></sc-if>
            <sc-if value="{{ n.isMensagens }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a7.5 7.5 0 0 1-10.9 6.7L4 20l1.4-5A7.5 7.5 0 1 1 21 11.5Z"></path></svg></sc-if>
            <sc-if value="{{ n.isCriar }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg></sc-if>
            <sc-if value="{{ n.isGrupos }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="6.6" r="3.2"></circle><circle cx="6.4" cy="16.6" r="3.2"></circle><circle cx="17.6" cy="16.6" r="3.2"></circle></svg></sc-if>
            <sc-if value="{{ n.isPerfil }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path></svg></sc-if>
          </span>
          <span class="one-line" style="min-width: 0; flex-grow: 1;">{{ n.label }}</span>
          <sc-if value="{{ n.badge }}" hint-placeholder-val="{{ true }}">
            <span aria-label="{{ n.badge }} conversas não lidas" style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: {{ accent }}; font-size: 12px; font-weight: 600; line-height: 1; color: var(--on-brand); flex-shrink: 0;">{{ n.badge }}</span>
          </sc-if>
        </a>
      </sc-for>

      <span style="display: block; height: 1px; background: var(--border); margin: 8px 12px;"></span>

      <a class="nav-item" href="#config" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-radius: 12px; background: {{ accent }}; color: var(--on-brand); font-size: 14px; font-weight: 500; line-height: 1.45; min-width: 0;">
        <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0;" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"></path></svg>
        </span>
        <span class="one-line" style="min-width: 0;">Configurações</span>
      </a>
    </nav>

    <nav aria-label="Seções das configurações" style="background: var(--surface); border-radius: 20px; padding: 16px 8px 8px; display: flex; flex-direction: column; gap: 12px;">
      <h1 style="margin: 0; padding: 0 8px; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1);">Configurações</h1>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{ secoes }}" as="s" hint-placeholder-count="6">
          <li>
            <a class="sec" href="#secao" aria-current="{{ s.current }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: 12px; background: {{ s.bg }}; min-width: 0;">
              <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1;">
                <span class="one-line" style="font-size: 14px; font-weight: {{ s.peso }}; line-height: 1.45; color: {{ s.cor }};">{{ s.label }}</span>
                <sc-if value="{{ s.valor }}" hint-placeholder-val="{{ true }}">
                  <span class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--text-4);">{{ s.valor }}</span>
                </sc-if>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#858487" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </li>
        </sc-for>
      </ul>
      <span style="display: block; height: 1px; background: var(--border); margin: 4px 12px;"></span>
      <a class="sec" href="#sair" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px;">
        <span style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; color: var(--error); flex-shrink: 0;" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3.5"></path><path d="M15 8.5 19 12l-4 3.5"></path><path d="M19 12H9.5"></path></svg>
        </span>
        <span class="one-line" style="font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--error); min-width: 0;">Sair da conta</span>
      </a>
    </nav>

    <section aria-labelledby="painel-titulo" style="background: var(--surface); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 24px; min-width: 0;">

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 id="painel-titulo" style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; color: var(--text-1);">Alterar senha</h2>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-3); max-width: 56ch;">Ao salvar, você continua conectado aqui e sai das outras sessões.</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: 16px; max-width: 420px;" onsubmit="{{ block }}">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="s-atual" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Senha atual</label>
          <input id="s-atual" type="password" placeholder="••••••••" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="s-nova" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Nova senha</label>
          <input id="s-nova" type="password" placeholder="••••••••" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--border); background: var(--elevated); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
          <span style="font-size: 12px; line-height: 1.4; color: var(--text-4);">Mínimo de 8 caracteres.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <label for="s-conf" style="font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-3);">Confirmar nova senha</label>
          <input id="s-conf" type="password" defaultValue="••••••" aria-invalid="true" aria-describedby="s-erro" style="width: 100%; min-width: 0; height: 52px; border-radius: 12px; border: 1px solid var(--error); background: var(--elevated); padding: 0 16px; font-family: inherit; font-size: 16px; color: var(--text-1);">
          <span id="s-erro" style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1.4; color: var(--error);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.6v5"></path><path d="M12 16.2h.01"></path></svg>
            As senhas não são iguais.
          </span>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px;">
          <button type="button" style="height: 48px; padding: 0 24px; border-radius: 12px; border: 0; background: {{ accent }}; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--on-brand); cursor: pointer;">Salvar senha</button>
          <button type="button" style="height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--border-strong); background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text-2); cursor: pointer;">Cancelar</button>
        </div>
      </form>

    </section>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6155F5';
    const flags = { isInicio: false, isBuscar: false, isMensagens: false, isCriar: false, isGrupos: false, isPerfil: false };
    const item = (label, href, key, badge) => Object.assign({}, flags, { label: label, href: href, badge: badge || '' }, (function () { const o = {}; o[key] = true; return o; })());
    const sec = (label, valor, ativo) => ({
      label: label,
      valor: valor,
      current: ativo ? 'page' : 'false',
      bg: ativo ? '#2C2B2F' : 'transparent',
      peso: ativo ? '600' : '500',
      cor: ativo ? '#F1F1F2' : '#D3D3D3'
    });

    return {
      accent: accent,
      block: (e) => { e.preventDefault(); },
      nav: [
        item('Início', 'Home-Desktop.dc.html', 'isInicio', ''),
        item('Buscar', 'Buscar-Desktop.dc.html', 'isBuscar', ''),
        item('Mensagens', 'Mensagens-Desktop.dc.html', 'isMensagens', '2'),
        item('Criar', 'Criar-Desktop.dc.html', 'isCriar', ''),
        item('Grupos', 'Grupos-Desktop.dc.html', 'isGrupos', ''),
        item('Perfil', 'Perfil-Desktop.dc.html', 'isPerfil', '')
      ],
      secoes: [
        sec('Alterar e-mail', 'richard@email.com', false),
        sec('Alterar senha', 'Trocada há 3 meses', true),
        sec('Privacidade da conta', 'Pública', false),
        sec('Notificações', 'Curtidas, comentários e menções', false),
        sec('Aparência', 'Escuro', false),
        sec('Idioma', 'Português (Brasil)', false)
      ]
    };
  }
}
</script>
</body>
</html>
