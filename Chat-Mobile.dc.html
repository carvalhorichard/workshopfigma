<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conversa — Mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --canvas: #19181B;
  --canvas-deep: #121114;
  --surface: #242326;
  --elevated: #2C2B2F;
  --border: #37363A;
  --border-strong: #4A494E;
  --text-1: #F1F1F2;
  --text-2: #D3D3D3;
  --text-2-dim: #BDBDBF;
  --text-3: #A2A2A2;
  --text-4: #858487;
  --text-5: #626166;
  --on-brand: #FFFFFF;
  --brand-100: #DAD7FF;
  --brand-200: #B6B1FF;
  --brand-300: #938CFF;
  --brand-400: #756BFF;
  --brand-500: #6155F5;
  --success: #4CCB88;
  --error: #EF5B67;
}
body { margin: 0; font-family: Inter, sans-serif; background: var(--canvas); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: var(--brand-200); text-decoration: none; }
a:hover { color: var(--brand-100); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand-300); outline-offset: 2px; }
input::placeholder { color: var(--text-4); }
img { max-width: 100%; display: block; }
.one-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--canvas); display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 4px; border-bottom: 1px solid var(--elevated); flex-shrink: 0;">
    <a href="Mensagens-Mobile.dc.html" aria-label="Voltar para mensagens" style="width: 44px; height: 44px; border-radius: 999px; color: var(--text-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <a href="#perfil" style="position: relative; display: block; width: 40px; height: 40px; flex-shrink: 0;">
      <span style="display: block; width: 40px; height: 40px; border-radius: 999px; overflow: hidden; background: var(--elevated);">
        <img src="./assets/b9d0e0c6462917737af4f43af3d11f54.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
      </span>
      <span style="position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 999px; background: var(--success); border: 2px solid var(--canvas);"></span>
    </a>
    <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex-grow: 1;">
      <a href="#perfil" class="one-line" style="font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--text-1);">Elina Castro</a>
      <span class="one-line" style="font-size: 12px; line-height: 1.4; color: var(--success);">online</span>
    </div>
    <button type="button" aria-label="Informações da conversa" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 7.6h.01"></path></svg>
    </button>
  </header>

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 0 8px;">
      <span style="flex-grow: 1; height: 1px; background: var(--elevated);"></span>
      <span style="font-size: 12px; line-height: 1.4; color: var(--text-5); flex-shrink: 0;">Hoje</span>
      <span style="flex-grow: 1; height: 1px; background: var(--elevated);"></span>
    </div>

    <sc-for list="{{ mensagens }}" as="m" hint-placeholder-count="6">
      <div style="display: flex; justify-content: {{ m.align }}; min-width: 0;">
        <div style="max-width: 78%; min-width: 0; padding: 8px 14px; border-radius: 16px; border-bottom-right-radius: {{ m.brRight }}; border-bottom-left-radius: {{ m.brLeft }}; background: {{ m.bg }}; display: flex; flex-direction: column; gap: 4px;">
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: {{ m.color }}; overflow-wrap: anywhere;">{{ m.texto }}</p>
          <span style="font-size: 12px; line-height: 1.3; color: {{ m.horaCor }}; align-self: flex-end;">{{ m.hora }}</span>
        </div>
      </div>
    </sc-for>

  </div>

  <div style="padding: 8px 16px 20px; border-top: 1px solid var(--elevated); display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
    <button type="button" aria-label="Anexar mídia" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m6 16 4-4 3 3 2-2 3 3"></path></svg>
    </button>
    <div style="position: relative; flex-grow: 1; min-width: 0;">
      <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;">Escreva uma mensagem</label>
      <input id="msg" type="text" placeholder="Escreva uma mensagem" style="width: 100%; min-width: 0; height: 48px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); padding: 0 46px 0 18px; font-family: inherit; font-size: 16px; color: var(--text-1);">
      <button type="button" aria-label="Inserir emoji" style="position: absolute; top: 2px; right: 2px; width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--text-3); display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 10h.01M15 10h.01M8.5 14.5a4.5 4.5 0 0 0 7 0"></path></svg>
      </button>
    </div>
    <button type="button" aria-label="Enviar mensagem" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: {{ accent }}; color: var(--on-brand); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 20 4l-7.5 16-2-6.5Z"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6155F5","options":["#6155F5","#756BFF","#558DF5"],"section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6155F5';
    const recebida = { align: 'flex-start', bg: '#242326', color: '#D3D3D3', horaCor: '#858487', brLeft: '4px', brRight: '16px' };
    const enviada = { align: 'flex-end', bg: accent, color: '#FFFFFF', horaCor: 'rgba(255, 255, 255, 0.72)', brLeft: '16px', brRight: '4px' };

    return {
      accent: accent,
      mensagens: [
        Object.assign({ texto: 'Passei no sebo da Augusta hoje', hora: '14:02' }, recebida),
        Object.assign({ texto: 'Achei o disco que você procurava! Tava na última prateleira, quase escondido', hora: '14:02' }, recebida),
        Object.assign({ texto: 'Não acredito 😍 quanto tá?', hora: '14:05' }, enviada),
        Object.assign({ texto: '90. E o vinil tá impecável, nem risco', hora: '14:06' }, recebida),
        Object.assign({ texto: 'Pega pra mim! Te pago sábado no ensaio', hora: '14:07' }, enviada),
        Object.assign({ texto: 'Fechado. Levo no ensaio então', hora: '14:08' }, recebida)
      ]
    };
  }
}
</script>
</body>
</html>
